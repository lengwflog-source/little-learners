<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5a8a5c">
<meta name="robots" content="noindex,nofollow">
<title>MR.LONG's ENGLISH HOUSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
img{max-width:100%}[hidden]{display:none!important}
/* Layout: sticky nav, hero with hill illustration, pastel unit circles, content cards on soft green ground */
:root{
  --bg:#f1f7e6;--bg2:#e4f0d4;--surface:#ffffff;--ink:#1d2b1f;--muted:#5b6d5e;--line:#d6e4c8;
  --primary:#5a8a5c;--primary-ink:#ffffff;--primary-deep:#3d6b45;--leaf:#7ea883;--wave:#7da681;
  --sun:#f2c744;--peach:#f7dccf;--mint:#e0f0dc;--butter:#fbf1c4;--sky:#d9e8f4;
  --good:#2e7d4e;--good-bg:#def1e2;--bad:#b3443a;--bad-bg:#fbe4df;--warn:#8a6a10;--warn-bg:#fcf0c8;
  --art-sky:#eef6e2;--art-cloud:#dcebf3;--art-hill1:#d2e7bd;--art-hill2:#a9cfa8;--art-house:#fffdf4;--art-tree:#78a878;
  --shadow:0 10px 28px rgba(61,107,69,.12);--display:'Fraunces',Georgia,serif;--body:'Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121d17;--bg2:#182a20;--surface:#1b2a21;--ink:#e7f1e3;--muted:#9fb5a4;--line:#2c4235;
  --primary:#86bb8a;--primary-ink:#0f1f12;--primary-deep:#a8d6ab;--leaf:#5f8f66;--wave:#2f5a3d;
  --sun:#f2c744;--peach:#4a3a33;--mint:#25402e;--butter:#463f22;--sky:#243a4a;
  --good:#7fd29c;--good-bg:#1f4130;--bad:#f09a8f;--bad-bg:#4a2723;--warn:#ecd37a;--warn-bg:#443a17;
  --art-sky:#16261d;--art-cloud:#2a3f4c;--art-hill1:#1f3a2a;--art-hill2:#2b5238;--art-house:#d9e6d0;--art-tree:#3f7a50;
  --shadow:0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121d17;--bg2:#182a20;--surface:#1b2a21;--ink:#e7f1e3;--muted:#9fb5a4;--line:#2c4235;
  --primary:#86bb8a;--primary-ink:#0f1f12;--primary-deep:#a8d6ab;--leaf:#5f8f66;--wave:#2f5a3d;
  --sun:#f2c744;--peach:#4a3a33;--mint:#25402e;--butter:#463f22;--sky:#243a4a;
  --good:#7fd29c;--good-bg:#1f4130;--bad:#f09a8f;--bad-bg:#4a2723;--warn:#ecd37a;--warn-bg:#443a17;
  --art-sky:#16261d;--art-cloud:#2a3f4c;--art-hill1:#1f3a2a;--art-hill2:#2b5238;--art-house:#d9e6d0;--art-tree:#3f7a50;
  --shadow:0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,6vw,3.6rem)}h2{font-size:clamp(1.6rem,3.6vw,2.2rem)}h3{font-size:1.25rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0}
.muted{color:var(--muted)}.small{font-size:.86rem}.eyebrow{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--leaf);font-weight:700}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand b{font-family:var(--display);font-size:1.05rem;line-height:1.1;display:block;letter-spacing:.01em}
.brand span{font-size:.7rem;color:var(--muted);display:block;line-height:1.1}
.nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav a{padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:700;font-size:.92rem;white-space:nowrap;color:var(--muted)}
.nav a:hover{background:var(--bg)}.nav a.on{background:var(--mint);color:var(--primary-deep)}
.who{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:.9rem}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--peach);display:grid;place-items:center;font-weight:800;color:var(--primary-deep)}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:0;cursor:pointer;background:var(--primary);color:var(--primary-ink);padding:11px 22px;border-radius:999px;font-weight:800;text-decoration:none;font-size:.95rem;transition:transform .12s,background .15s}
.btn:hover{background:var(--primary-deep);color:var(--surface);transform:translateY(-1px)}
.btn.ghost{background:var(--surface);color:var(--primary-deep);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--mint);color:var(--primary-deep)}
.btn.sm{padding:7px 14px;font-size:.84rem}.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

/* hero */
.hero{background:linear-gradient(180deg,var(--bg2),var(--bg));position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;align-items:center;padding-block:36px 8px}
.hero h1 span{color:var(--primary)}
.hero p.lead{margin:16px 0 24px;max-width:46ch;color:var(--muted);font-size:1.08rem}
.hero svg{width:100%;height:auto;max-height:340px;display:block;border-radius:36px 36px 120px 36px}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap}
@media (max-width:760px){.hero .wrap{grid-template-columns:1fr}.hero svg{max-height:230px}}
.wave{display:block;width:100%;height:46px}

section.blk{padding-block:34px}
.sechead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}

/* cards */
.card{background:var(--surface);border-radius:22px;padding:22px;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.kpi{display:flex;flex-direction:column;gap:2px}.kpi b{font-family:var(--display);font-size:2rem;line-height:1}.kpi span{color:var(--muted);font-size:.86rem}
.unit{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;text-decoration:none;padding:22px 14px}
.unit .disc{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;color:var(--primary-deep)}
.unit .disc svg{width:46px;height:46px}
.unit b{font-size:1.02rem}.unit small{color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;width:100%}.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.76rem;font-weight:800;background:var(--mint);color:var(--primary-deep);white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.good{background:var(--good-bg);color:var(--good)}.chip.sky{background:var(--sky);color:var(--ink)}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--bg2) 0);display:grid;place-items:center;flex:none}
.ring i{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal;font-size:.78rem;font-weight:800}
.lcard{display:flex;gap:14px;align-items:center;text-decoration:none;padding:16px 18px}
.lcard:hover{border-color:var(--leaf)}
.lcard .t{min-width:0;flex:1}.lcard .t b{display:block}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.sp{flex:1}
.banner{background:var(--butter);color:var(--ink);border-radius:14px;padding:10px 16px;font-size:.9rem;margin-block:12px}
.banner.err{background:var(--bad-bg)}
.crumb{font-size:.88rem;color:var(--muted);margin-bottom:10px}.crumb a{color:var(--primary-deep);font-weight:700;text-decoration:none}

/* lesson page */
.tabs{display:flex;gap:6px;background:var(--bg2);padding:5px;border-radius:99px;width:fit-content;max-width:100%;overflow-x:auto;margin-block:18px}
.tabs button{border:0;background:none;padding:8px 18px;border-radius:99px;font-weight:800;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--primary-deep);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.vocab{display:grid;gap:8px}
.vrow{display:grid;grid-template-columns:minmax(120px,1.2fr) auto 1fr;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.vrow b{font-size:1.05rem}.vrow .ipa{color:var(--muted);font-size:.9rem}
.say{border:0;background:var(--mint);border-radius:50%;width:30px;height:30px;cursor:pointer;margin-right:8px;vertical-align:middle;color:var(--primary-deep)}
@media (max-width:640px){.vrow{grid-template-columns:1fr}}
.prose{background:var(--surface);border-radius:20px;padding:20px 24px;border:1px solid var(--line);overflow-x:auto}
.prose p,.prose li{margin-block:6px}.prose table{border-collapse:collapse;width:100%}.prose td,.prose th{border:1px solid var(--line);padding:6px 10px;vertical-align:top}
.prose h3{margin-block:14px 6px}

/* exercise */
.ex{max-width:820px;margin-inline:auto}
.instr{font-family:var(--display);font-size:1.15rem;margin:8px 0 14px}
.passage{background:var(--butter);border-radius:16px;padding:14px 18px;margin-bottom:14px;max-height:340px;overflow:auto;font-size:.98rem}
.boxw{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;padding:12px;border:2px dashed var(--leaf);border-radius:16px}
.boxw span{background:var(--mint);padding:3px 12px;border-radius:99px;font-weight:700}
.pics{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}.pics img,.item img{max-height:190px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.item{padding:14px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.q{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--mint);color:var(--primary-deep);font-weight:800;font-size:.84rem;display:grid;place-items:center;margin-top:1px}
.q>div{min-width:0;flex:1}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px;margin:10px 0 0 40px}
.opt{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface);min-width:0}
.opt:hover{border-color:var(--leaf)}.opt input{accent-color:var(--primary)}
.opt .L{font-weight:800;color:var(--leaf)}
.opt.sel{border-color:var(--primary);background:var(--mint)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.blank,.txt,.sel-in{border:0;border-bottom:2px solid var(--leaf);background:var(--bg);border-radius:8px 8px 0 0;padding:3px 8px;min-width:70px;max-width:100%}
.txt{width:100%;display:block;margin-top:8px;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;resize:vertical;background:var(--surface)}
.sel-in{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:6px 8px;max-width:100%}
.ok-in{border-color:var(--good)!important;background:var(--good-bg)!important}.bad-in{border-color:var(--bad)!important;background:var(--bad-bg)!important}
.sub{margin:8px 0 0 40px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tfs{display:flex;gap:8px;margin:10px 0 0 40px;flex-wrap:wrap}
.sol{margin:8px 0 0 40px;font-size:.9rem;color:var(--good);font-weight:700}.sol.x{color:var(--bad)}
.expl{margin:4px 0 0 40px;font-size:.86rem;color:var(--muted)}
.hint{color:var(--muted);font-size:.88rem}
.ordrow,.mrow{display:flex;gap:10px;align-items:center;margin:8px 0 0 40px;flex-wrap:wrap}.ordrow span,.mrow span{flex:1;min-width:160px}
.mright{margin:8px 0 0 40px;display:grid;gap:4px;font-size:.94rem}
.mright:has(img){display:flex;flex-wrap:wrap;gap:10px 16px}
.mright:has(img)>div{display:flex;align-items:center;gap:6px}
.mright img{max-height:96px;max-width:150px;border-radius:10px;background:#fff;border:1px solid var(--line)}
.seg button.gsw.on{background:var(--primary);color:var(--primary-ink)}
body.g2{font-size:18px}
.em{font-size:2.6rem;line-height:1;display:inline-block;vertical-align:middle;margin-right:10px}.em.n{font-family:var(--display);font-weight:800;color:var(--primary-deep);font-size:2.4rem}.em svg{width:2.6rem;height:2.6rem;vertical-align:middle}
.oem{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:2.4rem;line-height:1.1;flex:1}.oem small{font-size:.78rem;color:var(--muted);font-weight:600}.oem svg{width:2.4rem;height:2.4rem}
.srow{display:flex;align-items:center;gap:10px;padding:6px 0}.srow b{font-size:1.5rem;font-family:var(--display)}.say.big{width:44px;height:44px;font-size:1.2rem;margin:0}
.fcard{cursor:pointer;border:2.5px dashed var(--leaf);border-radius:22px;background:var(--surface);min-height:150px;display:grid;place-items:center;text-align:center;padding:16px;user-select:none}.fcard .fb,.fcard.flip .ff{display:none}.fcard.flip .fb{display:block}.fcard .fb b{font-size:2rem;font-family:var(--display);display:block}.fcard small{display:block;color:var(--muted);margin-top:6px}.fcard .fb p{margin:6px 0;font-size:1.15rem}.fcard .ff .em{font-size:4.2rem;margin:0}
.bans{min-height:52px;border:2px dashed var(--leaf);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 8px 40px}.bpool{display:flex;flex-wrap:wrap;gap:8px;margin-left:40px}
.tok{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-size:1.1rem;font-weight:700;cursor:pointer;font-family:inherit;color:inherit}.tok.on{background:var(--mint);border-color:var(--leaf)}.tok:disabled{cursor:default}.bans.ok-in{border-color:var(--good);background:var(--good-bg)}.bans.bad-in{border-color:var(--bad);background:var(--bad-bg)}
.wsw{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-start;margin-top:6px}.wsg{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;width:min(100%,420px)}
.wsc{aspect-ratio:1;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;font-weight:800;font-size:1.05rem;cursor:pointer;padding:0;font-family:inherit;color:inherit}.wsc.sel{background:var(--butter);border-color:var(--primary)}.wsc.hit{background:var(--mint);border-color:var(--leaf);color:var(--primary-deep)}
.wsl{display:flex;flex-direction:column;gap:6px;min-width:150px}.wsw1{font-weight:700;font-size:1.05rem}.wsw1 .em{font-size:1.4rem;margin-right:6px}.wsw1.got{text-decoration:line-through;color:var(--muted)}
.recw{padding:6px 0 4px 40px}.recw .rt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.recw .rtext{font-size:1.35rem;font-family:var(--display)}.recw .rc{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 6px}.recw audio{height:38px;max-width:100%}
.btn.rec-on{background:#d64545;color:#fff;border-color:#d64545;animation:recp 1.1s infinite}@keyframes recp{50%{opacity:.6}}
.dlg{margin:6px 0 0 40px}.dlg details{margin-top:10px}.dlg summary{cursor:pointer;font-weight:700;color:var(--primary-deep)}.dlg .dl{margin:6px 0}
.tcm{background:var(--butter);border-left:4px solid var(--primary);border-radius:12px;padding:10px 14px;margin:10px 0}.tcm p{margin:4px 0;white-space:pre-wrap}
.vcard{margin-bottom:14px}.vcard.new{border-color:var(--primary);box-shadow:0 0 0 3px rgba(80,140,90,.18)}.badge{background:#d64545;color:#fff;border-radius:99px;padding:0 7px;font-size:.75rem;margin-left:4px}
.stars{font-size:2rem;color:#f5a524;letter-spacing:2px}
body.g2 .instr{font-size:1.3rem}
body.g2 .opt{padding:12px 16px;font-size:1.05rem;border-radius:16px}
body.g2 .item{padding:20px 0}
body.g2 .item img{max-height:160px}
body.g2 .blank,body.g2 .txt,body.g2 .sel-in{font-size:1.1rem}
body.g2 .btn{font-size:1.05rem;padding:13px 26px}
body.g2 .num{background:var(--butter);width:32px;height:32px;font-size:.95rem}
.actbar{position:sticky;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.result{display:flex;align-items:center;gap:14px;background:var(--mint);border-radius:18px;padding:14px 18px;margin-top:16px}
.result b{font-family:var(--display);font-size:1.8rem}

/* tables */
.tw{overflow-x:auto;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;min-width:560px}
.t th{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:10px 14px;background:var(--bg)}
.t td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--bg)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;cursor:pointer;font-weight:700;font-size:.8rem;color:var(--muted)}
.seg button.on.P{background:var(--good-bg);color:var(--good)}.seg button.on.L{background:var(--warn-bg);color:var(--warn)}.seg button.on.E{background:var(--sky);color:var(--ink)}.seg button.on.A{background:var(--bad-bg);color:var(--bad)}
.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-weight:800;font-size:.88rem}
.field input,.field select,.field textarea{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface);width:100%}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:4px 14px;max-height:240px;overflow:auto;padding:10px;border:1.5px solid var(--line);border-radius:12px}
.checks label{display:flex;gap:8px;font-size:.9rem;align-items:center}
.aspick input[type=checkbox],.checks input[type=checkbox]{width:auto!important;flex:none;padding:0;margin:0}.aspick{max-height:340px;overflow:auto;border:1.5px solid var(--line);border-radius:12px;padding:4px 10px}.asl{border-bottom:1px solid var(--line);padding:6px 0}.asl:last-child{border-bottom:0}.asl summary{cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:nowrap}.asl summary .small{margin-left:auto;text-align:right}.aslh{display:inline-flex;gap:8px;align-items:center}.asl .checks{max-height:none;border:0;padding:8px 0 4px 22px}
.codepill{font-family:var(--display);font-size:1.7rem;line-height:1;letter-spacing:.2em;background:var(--butter);padding:10px 20px;border-radius:14px;font-weight:600}
.welcome{max-width:520px;margin:-10px auto 40px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;z-index:90;font-weight:700;font-size:.9rem;max-width:90vw}
footer{padding-block:30px 40px;color:var(--muted);font-size:.84rem;text-align:center}
.sk{height:120px;border-radius:22px;background:linear-gradient(90deg,var(--bg2),var(--surface),var(--bg2));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const fmtD=d=>d?d.split('-').reverse().join('/'):'';
const fmtT=t=>{if(!t)return '—';const d=new Date(t);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const pct=x=>x==null?'—':Math.round(x*100)+'%';
const L2='ABCDEFGHIJ';
const emH=e=>e?`<span class="em${/^\d+$/.test(e)?' n':''}">${e}</span>`:'';

const S={recs:{},vlist:null,vf:'all',lessons:[],allL:[],grade:6,by:{},exL:{},db:null,user:null,uid:null,isT:false,isTA:false,loginMode:'main',notes:{},staff:null,staffLoaded:false,taCred:null,openL:{},ph:null,local:false,ready:false,
  prof:null,profLoaded:false,cfg:{classes:[],assignments:[],announcement:'',checkin:null,ciByCls:{}},all:{},att:{},sel:null,tab:'vocab',cls:'',date:today(),msg:'',fail:''};
let X=null; // current exercise state
let saving=false,dirty=false,saveT=null,pending=false;

/* ---------- art ---------- */
const ART=`<svg viewBox="0 0 520 380" role="img" aria-label="Đồi xanh, ngôi nhà nhỏ và mặt trời"><rect width="520" height="380" fill="var(--art-sky)"/><g fill="var(--art-cloud)"><path d="M30 96a26 26 0 0 1 48-12a32 32 0 0 1 60 8a22 22 0 0 1-4 44H48a24 24 0 0 1-18-40z"/><path d="M380 40a20 20 0 0 1 38-8a26 26 0 0 1 48 8a18 18 0 0 1-2 36h-78a18 18 0 0 1-6-36z"/></g>
<g stroke="var(--sun)" stroke-width="5" stroke-linecap="round"><path d="M250 30v-14M250 118v14M205 74h-14M295 74h14M218 42l-10-10M282 106l10 10M282 42l10-10M218 106l-10 10"/></g><circle cx="250" cy="74" r="30" fill="var(--sun)"/>
<path d="M0 380V210C80 168 170 182 250 214S430 236 520 190V380Z" fill="var(--art-hill1)"/>
<g transform="translate(300 120)"><path d="M0 62 48 20l48 42v56H0Z" fill="var(--art-house)" stroke="var(--primary)" stroke-width="3" stroke-linejoin="round"/><path d="M-8 64 48 14l56 50" fill="none" stroke="var(--primary)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="38" y="78" width="20" height="40" rx="10" fill="var(--peach)" stroke="var(--primary)" stroke-width="2"/><rect x="12" y="74" width="16" height="16" rx="3" fill="var(--art-cloud)" stroke="var(--primary)" stroke-width="2"/><rect x="68" y="74" width="16" height="16" rx="3" fill="var(--art-cloud)" stroke="var(--primary)" stroke-width="2"/><path d="M48 38c-6-6-14 2-8 8l8 7 8-7c6-6-2-14-8-8z" fill="var(--primary)"/></g>
<g><rect x="96" y="150" width="10" height="70" rx="4" fill="var(--primary-deep)"/><ellipse cx="101" cy="130" rx="38" ry="52" fill="var(--art-tree)"/><rect x="438" y="170" width="9" height="56" rx="4" fill="var(--primary-deep)"/><ellipse cx="442" cy="154" rx="30" ry="42" fill="var(--art-tree)"/></g>
<path d="M0 380V280C110 250 210 286 310 276S460 252 520 270V380Z" fill="var(--art-hill2)"/>
<g fill="#fff"><circle cx="60" cy="300" r="5"/><circle cx="150" cy="318" r="5"/><circle cx="380" cy="306" r="5"/><circle cx="470" cy="300" r="5"/></g><g fill="var(--sun)"><circle cx="60" cy="300" r="2"/><circle cx="150" cy="318" r="2"/><circle cx="380" cy="306" r="2"/><circle cx="470" cy="300" r="2"/></g></svg>`;
const WAVE=`<svg class="wave" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30C220 70 440 0 700 28S1180 62 1440 20V60H0Z" fill="var(--bg)"/></svg>`;
const LOGO=`<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 20 20 8l14 12v14H6Z" fill="var(--mint)" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round"/><rect x="16" y="23" width="8" height="11" rx="4" fill="var(--peach)" stroke="var(--primary)" stroke-width="1.5"/><path d="M20 5c-2-5 6-6 8-3-1 5-5 6-8 3z" fill="var(--primary)"/></svg>`;
const ICONS={
 4:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M6 42V22l9-6 9 6v20M24 42V12l9-6 9 6v30M3 42h42M12 30h6M30 20h6M30 28h6M30 36h6"/></svg>`,
 5:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M3 40 17 16l8 12 6-8 14 20Z"/><circle cx="36" cy="10" r="4"/></svg>`,
 6:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M24 8v4M17 12h14M13 14h22a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H13a4 4 0 0 1-4-4V18a4 4 0 0 1 4-4ZM24 36v8M20 44h8"/><path d="M19 22c1 6 9 6 10 0"/></svg>`,
 0:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M12 5h18l8 8v30H12Z"/><path d="M30 5v8h8M18 22h14M18 29h14M18 36h8"/></svg>`};
ICONS[101]=`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M24 5l5.6 11.6 12.6 1.8-9.1 8.9 2.1 12.5L24 33.8 12.8 39.8l2.1-12.5-9.1-8.9 12.6-1.8z"/></svg>`;
ICONS[102]=`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M24 14c-5-4-14-2-14 8 0 9 6 18 11 18 1.5 0 2-1 3-1s1.5 1 3 1c5 0 11-9 11-18 0-10-9-12-14-8z"/><path d="M24 14c0-4 2-7 6-8"/></svg>`;
ICONS[103]=`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><circle cx="24" cy="24" r="8"/><path d="M24 5v6M24 37v6M5 24h6M37 24h6M10.6 10.6l4.2 4.2M33.2 33.2l4.2 4.2M37.4 10.6l-4.2 4.2M14.8 33.2l-4.2 4.2"/></svg>`;
ICONS[104]=`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M6 10h14c2 0 4 1 4 4v26c0-3-2-4-4-4H6zM42 10H28c-2 0-4 1-4 4v26c0-3 2-4 4-4h14z"/></svg>`;
const DISC={4:'var(--peach)',5:'var(--mint)',6:'var(--butter)',0:'var(--sky)',101:'var(--peach)',102:'var(--mint)',103:'var(--butter)',104:'var(--sky)'};
ICONS[201]=ICONS[101];ICONS[202]=ICONS[102];ICONS[203]=ICONS[103];ICONS[204]=ICONS[104];ICONS[205]=ICONS[101];ICONS[206]=ICONS[102];
Object.assign(DISC,{201:'var(--peach)',202:'var(--mint)',203:'var(--butter)',204:'var(--sky)',205:'var(--peach)',206:'var(--mint)'});
const GN={6:'Lớp 6',2:'Lớp 2',8:'Lớp 3',3:'A1+',9:'IELTS 1'},GS={6:'Tiếng Anh 6 · Global Success',2:'Tiếng Anh 2',8:'Tiếng Anh 3',3:'English A1+ · Elementary',9:'IELTS 1 · Band 3.0–5.0'};
const IB=()=>X&&X.L&&X.L.grade===2?'lop2/img/':'img/';
function setGrade(g){S.grade=g;S.lessons=S.allL.filter(L=>L.grade===g);try{localStorage.setItem('ll-grade',String(g))}catch(e){}}
function initGrade(){let g=6;try{g=Number(localStorage.getItem('ll-grade'))||6}catch(e){}
  if(S.user&&!S.isT&&S.user.grade)g=Number(S.user.grade);
  if(!S.allL.some(L=>L.grade===g))g=6;setGrade(g)}
const gradeSw=()=>{const gs=[6,2,8,3,9].filter(g=>S.allL.some(L=>L.grade===g));if(gs.length<2||(!S.isT&&S.user&&S.user.grade))return'';
  return`<div class="seg" role="group" aria-label="Chọn khối">${gs.map(g=>`<button class="gsw ${S.grade===g?'on':''}" data-grade="${g}">${GN[g]}</button>`).join('')}</div>`};

/* ---------- data helpers ---------- */
const lessonUnits=()=>{const g=[];S.lessons.forEach(L=>{let u=g.find(x=>x.key===L.unit);if(!u){u={key:L.unit,title:L.grade!==6?L.unitTitle:(L.unit?'Unit '+L.unit:'Đề ôn tập HK1'),sub:L.grade===2||L.grade===8?'Bài tập có hình':L.grade===9?'Vocabulary · Reading · Listening · Writing · Speaking':L.grade===3?'Từ vựng · Ngữ pháp · Nghe · Phát âm':(L.unit?L.unitTitle:'Ôn luyện cuối kì'),lessons:[]};g.push(u)}u.lessons.push(L)});return g};
const exArr=p=>(p&&p.ex)||{};
function lessonStat(p,L){const ex=exArr(p);let done=0,sum=0,cnt=0;for(const E of L.exercises){const r=ex[E.id];if(r){done++;if(r.n>0){sum+=r.c/r.n;cnt++}}}const total=L.exercises.length;return{done,total,pct:total?done/total:0,avg:cnt?sum/cnt:null}}
function overall(p){let done=0,total=0,sum=0,cnt=0;const ex=exArr(p);for(const L of S.lessons)for(const E of L.exercises){total++;const r=ex[E.id];if(r){done++;if(r.n>0){sum+=r.c/r.n;cnt++}}}return{done,total,pct:total?done/total:0,avg:cnt?sum/cnt:null}}
function streak(p){const d=new Set((p&&p.days)||[]);let n=0;const x=new Date();if(!d.has(dstr(x)))x.setDate(x.getDate()-1);while(d.has(dstr(x))){n++;x.setDate(x.getDate()-1)}return n}
const exTitle=E=>E.title;
function nextEx(p){const ex=exArr(p);let last=null,lt=0;for(const id in ex){if(ex[id].t>lt){lt=ex[id].t;last=id}}
  const order=[];S.lessons.forEach(L=>L.exercises.forEach(E=>order.push(E.id)));
  let start=last?order.indexOf(last)+1:0;for(let k=0;k<order.length;k++){const id=order[(start+k)%order.length];if(!ex[id])return id}return null}
function visibleStudents(){return Object.entries(S.all).map(([uid,p])=>({uid,p})).filter(x=>!S.cls||x.p.cls===S.cls).filter(x=>!x.p.grade||Number(x.p.grade)===S.grade).sort((a,b)=>(a.p.name||'').localeCompare(b.p.name||'','vi'))}
function myAssignments(){const c=S.prof&&S.prof.cls;return(S.cfg.assignments||[]).filter(a=>!a.cls||a.cls===c).filter(a=>{const L=S.by[(a.lessons||[])[0]];return !L||L.grade===S.grade})}
function assignExs(a){return(a.ex||[]).map(id=>{const L=S.by[S.exL[id]];const E=L&&L.exercises.find(e=>e.id===id);return E?{L,E}:null}).filter(Boolean)}
function asLink(p,a){const ex=exArr(p);if(a.ex&&a.ex.length){const xs=assignExs(a);const n=xs.find(x=>!ex[x.E.id])||xs[0];return n?'ex-'+n.E.id:'lessons'}return 'lesson-'+((a.lessons||[])[0]||'')}
function asParts(p,a){if(!(a.ex&&a.ex.length))return'';const ex=exArr(p);return`<details style="margin-top:6px"><summary class="small" style="cursor:pointer;color:var(--primary-deep);font-weight:700">Xem các phần được giao</summary>${assignExs(a).map(x=>`<a class="row small" style="text-decoration:none;padding:3px 0" href="#ex-${x.E.id}"><span>${ex[x.E.id]?'✅':'⬜'}</span><span><b>${esc(x.L.title)}</b> · ${esc(x.E.title)}</span></a>`).join('')}</details>`}
function assignStat(p,a){let done=0,total=0;const ex=exArr(p);if(a.ex&&a.ex.length){for(const x of assignExs(a)){total++;if(ex[x.E.id])done++}return{done,total,pct:total?done/total:0}}for(const id of a.lessons||[]){const L=S.by[id];if(!L)continue;for(const E of L.exercises){total++;if(ex[E.id])done++}}return{done,total,pct:total?done/total:0}}

/* ---------- grading ---------- */
const norm=s=>String(s==null?'':s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim();
const loose=s=>norm(s).replace(/[.,!?;:"]/g,'').replace(/\s+/g,' ').trim();
const same=(a,b)=>loose(a)===loose(b);
function units(it){switch(it.t){case'mcq':case'tf':case'text':case'build':case'rec':case'wr':case'sp':return 1;case'ws':return it.words.length;case'fill':return it.a.length;case'order':return it.steps.length;case'match':return it.left.length;case'cat':return it.words.length;default:return 0}}
function gradeItem(it,a,k){switch(it.t){
  case'wr':case'sp':return[ieDone(k)];
  case'mcq':return[a===it.a];
  case'tf':return[a===it.a];
  case'text':return[it.a.some(v=>same(v,a))];
  case'build':{const t=(Array.isArray(a)?a:[]).map(k=>it.tokens[k]).join(it.join);return[it.a.some(v=>same(v,t))]}
  case'ws':return it.words.map(w=>(Array.isArray(a)?a:[]).includes(w));
  case'rec':return[!!a];
  case'fill':return it.a.map((vs,k)=>vs.some(v=>same(v,(a||[])[k])));
  case'order':return it.steps.map((_,k)=>Number((a||[])[k])===it.a.indexOf(k)+1);
  case'match':case'cat':return it.a.map((v,k)=>String((a||[])[k])===String(v));
  default:return null}}
function gradeEx(E,ans){let c=0,n=0;const res=E.items.map((it,i)=>{const g=gradeItem(it,ans[i],E.id+':'+i);if(g){n+=g.length;c+=g.filter(Boolean).length}return g});return{res,c,n}}
function solText(it){switch(it.t){
  case'mcq':return it.opts[it.a];
  case'tf':return it.tick?(it.a==='T'?'✔ Đúng':'✘ Sai'):it.a==='T'?'True':it.a==='F'?'False':'Not given';
  case'text':case'build':return it.a[0];
  case'ws':return it.words.join(', ');
  case'rec':return'Hãy thu âm giọng đọc của bạn';
  case'wr':case'sp':return'';
  case'fill':return it.a.map(v=>v[0]).join(' · ');
  case'order':return it.steps.map((_,k)=>(k+1)+'→'+(it.a.indexOf(k)+1)).join('  ');
  case'match':return it.left.map((l,k)=>(k+1)+'-'+L2[it.a[k]]).join('  ');
  case'cat':return it.words.map((w,k)=>w+' → '+it.cats[it.a[k]]).join('; ');
  default:return it.sample||''}}

/* ---------- api ---------- */
const TK='ll-token';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const API={tok:null,async call(m,p,b){const h={'content-type':'application/json'};if(API.tok)h.authorization='Bearer '+API.tok;let r;
  try{r=await fetch('/api/'+p,{method:m,headers:h,body:b!==undefined?JSON.stringify(b):undefined})}catch(e){const x=new Error('Không kết nối được máy chủ. Kiểm tra mạng và thử lại.');x.status=0;throw x}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const x=new Error(j.error||('Lỗi '+r.status));x.status=r.status;throw x}return j}};
function toast(m){const t=$('#toast');t.className='toast';t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}
function saveProf(){dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,150)}
async function flush(){
  if(!S.prof||S.isT||!dirty)return;if(saving){setTimeout(flush,400);return}
  dirty=false;saving=true;S.prof.last=Date.now();
  try{const{name,cls,ci,...rest}=S.prof;await API.call('PUT','progress',rest);S.fail=''}
  catch(e){if(e.status===401){logout();return}S.fail='Chưa lưu được tiến trình: '+e.message;toast(S.fail);if(e.status!==400&&e.status!==403){dirty=true;setTimeout(flush,15000)}}
  saving=false;if(dirty)flush();
}
addEventListener('pagehide',()=>{if(dirty&&S.prof&&!S.isT&&API.tok){try{const{name,cls,ci,...rest}=S.prof;fetch('/api/progress',{method:'PUT',keepalive:true,headers:{'content-type':'application/json',authorization:'Bearer '+API.tok},body:JSON.stringify(rest)})}catch(e){}}});
async function cfgOp(b){try{const r=await API.call('PUT','config',b);S.cfg=Object.assign({classes:[],assignments:[],announcement:'',checkin:null,ciByCls:{}},r.config||{})}catch(e){toast(e.message)}render()}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Đã sao chép')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Đã sao chép')}catch(_){toast('Không sao chép được, hãy chọn và copy thủ công')}ta.remove()}}
function logout(){API.tok=null;lsSet(TK,null);S.user=null;S.prof=null;S.all={};S.att={};S.isT=false;S.isTA=false;S.notes={};S.staff=null;S.taCred=null;S.uid=null;S.creds=null;X=null;location.hash='';render()}

function refresh(force){const a=document.activeElement;
  if(!force&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#app').contains(a)){pending=true;return}
  if(!force&&route().startsWith('ex-'))return;
  if(!force&&route()==='t-ta')return;
  if(!force&&document.querySelector('input[name=as-e]:checked'))return;
  pending=false;render()}
document.addEventListener('focusout',()=>{if(pending)setTimeout(()=>{if(!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))refresh(true)},120)});

function applyMe(d){const isStaff=!!(d.user&&(d.user.role==='teacher'||d.user.role==='ta'));
  if(!isStaff)setTimeout(()=>loadAi().then(()=>{if(!route().startsWith('ex-'))refresh();else if(X&&X.E)X.E.items.forEach((it,i)=>{if(it.t==='wr'||it.t==='sp')refreshItem(i)});if(aiHasPending())startAiPoll()}),0);
  if(!isStaff)setTimeout(()=>loadRecs().then(()=>{if(!route().startsWith('ex-'))refresh();else if(X&&X.E)X.E.items.forEach((it,i)=>{if(it.t==='rec')refreshItem(i)})}),0);
  S.user=d.user;S.isT=isStaff;S.isTA=d.user.role==='ta';S.uid=d.user.username;
  S.cfg=Object.assign({classes:[],assignments:[],announcement:'',checkin:null,ciByCls:{}},d.config||{});
  if(!S.isT){S.prof=Object.assign({ex:{},lv:{},ci:{},days:[]},d.progress||{},{name:d.user.name,cls:d.user.cls});if(!S.prof.ex)S.prof.ex={};S.att={};Object.entries(d.mine||{}).forEach(([dt,c])=>{S.att[dt]={[S.uid]:c}})}}
async function loadTeacher(){const[st,at]=await Promise.all([API.call('GET','students'),API.call('GET','attendance')]);
  S.all={};st.students.forEach(x=>{S.all[x.username]=Object.assign({ex:{},lv:{},ci:{},days:[]},x.progress||{},{name:x.name,cls:x.cls,grade:x.grade||'',ptoken:x.ptoken||'',reports:x.reports||{}})});S.att=at.dates||{};S.notes=at.notes||{}}
let lastAct=Date.now(),lastPoll=0;['pointerdown','keydown','touchstart','wheel'].forEach(e=>addEventListener(e,()=>{lastAct=Date.now()},{passive:true}));
/* hỏi máy chủ thưa: 90 giây/lần, dừng khi ẩn tab hoặc 5 phút không thao tác */
async function poll(){if(!S.user||document.hidden||saving||dirty||Date.now()-lastAct>300000)return;
  lastPoll=Date.now();try{if(S.isT){await loadTeacher();const c=await API.call('GET','config');S.cfg=Object.assign({},S.cfg,c.config)}
    else{await loadRecs();const d=await API.call('GET','me');S.cfg=Object.assign({},S.cfg,d.config);S.att={};Object.entries(d.mine||{}).forEach(([dt,c])=>{S.att[dt]={[S.uid]:c}});if(d.progress){if(d.progress.ci)S.prof.ci=d.progress.ci;const srv=d.progress.ex||{};Object.keys(S.prof.ex||{}).forEach(id=>{if(!srv[id])delete S.prof.ex[id]})}}
    refresh()}catch(e){if(e.status===401)logout()}}

async function init(){
  const mph=/^#ph-([a-f0-9]{32})$/.exec(location.hash);
  if(mph){S.ph={loading:true};S.ready=true;render();try{S.ph=await API.call('GET','parent/'+mph[1])}catch(e){S.ph={err:e.message}}render();return}
  if(location.hash==='#tro-giang')S.loginMode='ta';
  render();
  try{const r=await fetch('lessons.json');S.allL=await r.json();S.allL.forEach(L=>{L.grade=6;L.label=(L.unit?'Unit '+L.unit+' · ':'')+L.title})}catch(e){$('#app').innerHTML='<div class="wrap"><div class="banner err">Không tải được dữ liệu bài học. Hãy tải lại trang.</div></div>';return}
  try{const r=await fetch('lop2/lessons.json');if(r.ok){const t=(await r.text()).split('{{IMG}}').join('lop2/img/');const g2=JSON.parse(t);g2.forEach(L=>{L.grade=2;L.label=L.title+(L.sub?' · '+L.sub:'')});S.allL=S.allL.concat(g2)}}catch(e){}
  try{const r=await fetch('ef/lessons.json');if(r.ok){const e3=await r.json();e3.forEach(L=>{L.grade=3;L.label=L.title+(L.sub?' · '+L.sub:'')});S.allL=S.allL.concat(e3)}}catch(e){}
  try{const r=await fetch('lop3/lessons.json');if(r.ok){const e8=await r.json();e8.forEach(L=>{L.grade=8;L.label=L.title+(L.sub?' · '+L.sub:'')});S.allL=S.allL.concat(e8)}}catch(e){}
  try{const r=await fetch('ielts/lessons.json');if(r.ok){const e9=await r.json();e9.forEach(L=>{L.grade=9;L.label=L.title+(L.sub?' · '+L.sub:'')});S.allL=S.allL.concat(e9)}}catch(e){}
  S.allL.forEach(L=>{S.by[L.id]=L;L.exercises.forEach(E=>{S.exL[E.id]=L.id})});
  API.tok=lsGet(TK);
  if(API.tok){try{applyMe(await API.call('GET','me'));if(S.isT)await loadTeacher()}catch(e){if(e.status===401){API.tok=null;lsSet(TK,null)}else S.fail=e.message}}
  if(!S.user){try{const st=await API.call('GET','status');S.needSetup=st.setup;S.needCode=st.needsCode}catch(e){S.fail=e.message}}
  initGrade();S.ready=true;render();
  setInterval(poll,90000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastPoll>90000)poll()});
}

/* ---------- routing ---------- */
const route=()=>{const h=(location.hash||'').slice(1);return h||(S.isT?'t-home':'home')};
addEventListener('hashchange',()=>{scrollTo(0,0);render()});
const hdr=()=>{const r=route(),I=(h,t,on)=>`<a href="#${h}" class="${on?'on':''}">${t}</a>`;
  const nav=S.isT?I('t-home','Tổng quan',r==='t-home')+I('t-students','Học sinh',r.startsWith('t-student'))+I('t-attendance','Điểm danh',r==='t-attendance')+I('t-assign','Giao bài',r==='t-assign')+I('t-voice','Bản thu âm',r==='t-voice')+(S.isTA?'':I('t-ai','Chấm IELTS',r==='t-ai')+I('t-ta','Trợ giảng',r==='t-ta'))+I('lessons','Bài học',r==='lessons'||r.startsWith('lesson-')||r.startsWith('ex-')):
    I('home','Trang chủ',r==='home')+I('lessons','Bài học',r==='lessons'||r.startsWith('lesson-')||r.startsWith('ex-'))+I('progress','Tiến độ',r==='progress')+I('voice','Bản thu'+(unseen()?` <span class="badge">${unseen()}</span>`:''),r==='voice');
  const nm=S.user?S.user.name:'';
  return`<header class="top"><div class="wrap"><a class="brand" href="#${S.isT?'t-home':'home'}">${LOGO}<div><b>MR.LONG's ENGLISH HOUSE</b><span>${GS[S.grade]||GS[6]}</span></div></a>${S.ready&&S.user?`<nav class="nav" aria-label="Menu chính">${nav}</nav><div class="who">${gradeSw()}<span class="avatar" aria-hidden="true">${esc((nm[0]||'?').toUpperCase())}</span><span>${esc(nm)}</span><a class="btn ghost sm" href="#profile">Tài khoản</a></div>`:''}</div></div></header>`};

function render(){
  if(S.ph){document.body.classList.remove('g2');$('#app').innerHTML=parentView();return}
  document.body.classList.toggle('g2',S.grade===2||S.grade===8);
  const r=route();let body='';
  if(!S.ready||!S.lessons.length)body=`<div class="wrap" style="padding-block:40px"><div class="sk"></div><div class="grid g3" style="margin-top:16px"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>`;
  else if(!S.user)body=loginView();
  else if(r==='profile')body=profileView();
  else{
    if(r==='home')body=S.isT?teacherHome():homeView();
    else if(r==='lessons')body=lessonsView();
    else if(r==='progress')body=progressView();
    else if(r.startsWith('lesson-'))body=lessonView(r.slice(7));
    else if(r.startsWith('ex-'))body=exView(r.slice(3));
    else if(r==='t-home'&&S.isT)body=teacherHome();
    else if(r==='t-students'&&S.isT)body=studentsView();
    else if(r==='t-student'&&S.isT)body=studentDetail();
    else if(r==='t-attendance'&&S.isT)body=attendanceView();
    else if(r==='t-assign'&&S.isT)body=assignView();
    else if(r==='t-voice'&&S.isT)body=teacherVoiceView();
    else if(r==='t-ai'&&S.isT&&!S.isTA)body=ieTeacherAi();
    else if(r==='t-ta'&&S.isT&&!S.isTA)body=taView();
    else if(r==='voice'&&!S.isT)body=voiceView();
    else body=S.isT?teacherHome():homeView();
  }
  const keepY=scrollY;
  $('#app').innerHTML=hdr()+(S.fail&&S.ready?`<div class="wrap"><div class="banner err">${esc(S.fail)}</div></div>`:'')+(!S.isT&&r==='home'&&unseen()?`<div class="wrap"><div class="banner">💬 Thầy/cô vừa nhận xét ${unseen()} bản thu âm của bạn. <a href="#voice"><b>Xem ngay</b></a></div></div>`:'')+body+`<footer><div class="wrap">MR.LONG's ENGLISH HOUSE · ${S.grade===6?'Tiếng Anh 6 · Học kì 1':GS[S.grade]}</div></footer>`;
  if(r.startsWith('ex-')===false)scrollTo(0,keepY);
}

function resultsHtml(L,p){if(!p)return`<div class="card"><p class="muted">Học sinh đăng nhập sẽ thấy bảng kết quả của riêng mình ở đây.</p></div>`;
  const ex=exArr(p);let c=0,n=0,done=0;

const MALE_N=/^(peter|tom|mark|nam|leo|jack|ravi|dan|daniel|guest|customer_m|traveller|tourist|waiter)$/i,FEM_N=/^(mai|sara|hanh|hoa|lan|emma|hana|mina|ms reed|receptionist|barista|passer-by|assistant)$/i;
let DLGTOK=0;
function pickVoice(vs,male){const m=/male(?!.*female)|david|mark|daniel|alex|fred|guy|george|james|ryan|aaron|arthur|rishi|thomas|oliver|christopher|eric|roger|steffan/i,f=/female|samantha|zira|susan|karen|moira|aria|jenny|libby|serena|victoria|allison|ava|sonia|hazel|emma|joanna|kate|tessa|google us english/i;
  const c=vs.filter(v=>male?m.test(v.name)&&!/female/i.test(v.name):f.test(v.name));return c.find(v=>/en-US|en-GB/i.test(v.lang))||c[0]||null}
function spokenText(t){return String(t).replace(/\bMs\b\.?/g,'Miz').replace(/\bMrs\b\.?/g,'Missiz').replace(/\bMr\b\.?/g,'Mister').replace(/Wi-Fi/gi,'Why Fy').replace(/…/g,'').replace(/\bOK\b/g,'okay')}
function dlgGender(lines){const sp=[...new Set(lines.map(l=>l[0]))],g={};sp.forEach(n=>{g[n]=FEM_N.test(n)?'f':MALE_N.test(n)?'m':null});
  if(sp.length>1){if(!g[sp[0]]&&g[sp[1]])g[sp[0]]=g[sp[1]]==='m'?'f':'m';if(!g[sp[1]]&&g[sp[0]])g[sp[1]]=g[sp[0]]==='m'?'f':'m'}
  if(!g[sp[0]]){g[sp[0]]='f';if(sp[1])g[sp[1]]='m'}return g}
function mkUtt(text,male,rate){const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));const v=pickVoice(vs,male);const u=new SpeechSynthesisUtterance(spokenText(text));u.lang=v?v.lang:'en-US';if(v)u.voice=v;
  u.rate=rate||.8;u.pitch=male?(v?.95:.75):(v?1:1.1);u.volume=1;return u}
function playDlg(lines){try{speechSynthesis.cancel();const tok=++DLGTOK;const g=dlgGender(lines);
  const next=k=>{if(tok!==DLGTOK||k>=lines.length)return;const l=lines[k];const u=mkUtt(l[1],g[l[0]]==='m');
    u.onend=()=>setTimeout(()=>next(k+1),/[?]$/.test(l[1])?700:500);u.onerror=()=>{};speechSynthesis.speak(u)};
  next(0)}catch(_){}}
async function toggleRec(i){const eid=X.E.id,k=eid+':'+i;
  if(RECING){const same=RECING.k===k;RECING.mr.stop();if(same)return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(st);const ch=[];
    mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
    mr.onstop=()=>{clearTimeout(RECING&&RECING.tm);st.getTracks().forEach(t=>t.stop());if(REC[k])URL.revokeObjectURL(REC[k]);const bl=new Blob(ch,{type:mr.mimeType||'audio/webm'});REC[k]=URL.createObjectURL(bl);RB[k]=bl;RECING=null;if(X&&X.E.id===eid){X.ans[i]=true;refreshItem(i)}uploadRec(eid,i,bl,(X&&X.E.items[i]?(X.E.items[i].prompt||X.E.items[i].w):'')+'')};
    RECING={k,mr,tm:setTimeout(()=>{try{mr.state!=='inactive'&&mr.stop()}catch(_){}},40000)};mr.start();refreshItem(i)}
  catch(e){RECING=null;toast('Không mở được micro. Hãy bấm "Cho phép" khi trình duyệt hỏi quyền dùng micro.')}}
function recStatus(k,i,url,a,done){const m=S.recs[k],st=RS[k];
  if(st==='up')return'<span class="chip">Đang gửi cho giáo viên…</span>';
  if(st==='err')return`<span class="chip bad">Chưa gửi được</span><button class="btn ghost sm" data-recretry="${i}">Gửi lại</button>`;
  if(m&&!m.expired)return`<span class="chip good">Đã gửi · tự xóa sau ${daysLeft(m)}</span>${url?'':`<button class="btn ghost sm" data-recplay="${i}">▶ Nghe lại bản đã gửi</button>`}`;
  if(m&&m.expired)return'<span class="chip">Bản thu đã hết hạn 7 ngày</span>';
  return a&&!url?'<span class="chip good">Đã thu âm</span>':''}
function recComment(k){const m=S.recs[k];return m&&m.comment?`<div class="tcm"><b>💬 Nhận xét của giáo viên</b><p>${esc(m.comment)}</p><span class="muted small">${fmtT(m.commentAt)}</span></div>`:''}
function refreshItem(i){const els=document.querySelectorAll('#app .item');if(els[i])els[i].outerHTML=itemHtml(X.E.items[i],i,false,null)}
function collect(){ // read DOM inputs into X.ans (text-like values)
  document.querySelectorAll('#app [data-i]').forEach(el=>{const i=+el.dataset.i,it=X.E.items[i];if(!it)return;
    if(el.type==='radio'){if(el.checked)X.ans[i]=it.t==='mcq'?+el.value:el.value}
    else if(el.dataset.k!=null&&el.dataset.k!==''){const k=+el.dataset.k;if(!Array.isArray(X.ans[i]))X.ans[i]=[];X.ans[i][k]=el.value}
    else X.ans[i]=el.value})}
function doCheck(force){collect();
  if(!S.isT&&!X.practice){
    if(S.prof&&S.prof.ex&&S.prof.ex[X.E.id]){const id=X.E.id;X=null;startEx(id);render();toast('Bài này đã có kết quả lần đầu.');return}
    if(!force){const miss=missing(X.E,X.ans);if(miss>0){X.confirm=true;X.miss=miss;const b=$('.actbar');if(b)b.outerHTML=actbar();return}}}
  X.confirm=false;X.g=gradeEx(X.E,X.ans);X.checked=true;
  if(S.prof&&!S.isT&&!X.practice){const clean=JSON.parse(JSON.stringify(X.ans));S.prof.ex=S.prof.ex||{};S.prof.ex[X.E.id]={c:X.g.c,n:X.g.n,t:Date.now(),a:clean};S.prof.days=S.prof.days||[];const t=today();if(!S.prof.days.includes(t)){S.prof.days.push(t);S.prof.days=S.prof.days.slice(-120)}saveProf()}
  render();scrollTo(0,0)}

function ptokCard(p){const link=p.ptoken?location.origin+'/#ph-'+p.ptoken:'';

function repBlock(L,p,s){const rp=(p.reports||{})[L.id];let c=0,n=0;const ex=exArr(p);L.exercises.forEach(E=>{const r=ex[E.id];if(r){c+=r.c;n+=r.n}});

  ${S.isTA?'':`<div class="card"><h3 style="margin-bottom:12px">Thông báo cho lớp</h3><div class="field"><textarea id="ann" rows="3" placeholder="Ví dụ: Thứ Sáu kiểm tra 15 phút Unit 4." aria-label="Thông báo">${esc(S.cfg.announcement||'')}</textarea></div><button class="btn sm" data-act="saveann">Lưu thông báo</button></div>

   ${r.note?`<div class="tcm"><b>💬 Nhận xét của giáo viên</b><p>${esc(r.note)}</p></div>`:''}</div>`).join(''):'<div class="card"><p class="muted">Giáo viên chưa báo điểm phần nào. Khi bé hoàn thành một phần bài, điểm sẽ hiện ở đây.</p></div>'}

  ${att.length?`<div class="tw"><table class="t" style="min-width:0"><thead><tr><th>Ngày</th><th>Điểm danh</th><th>Nhận xét của giáo viên</th></tr></thead><tbody>${att.map(a=>`<tr><td style="white-space:nowrap">${fmtD(a.date)}</td><td>${a.status&&st[a.status]?`<span class="chip ${st[a.status][1]}">${st[a.status][0]}</span>`:'<span class="muted">—</span>'}</td><td>${a.note?esc(a.note):'<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card"><p class="muted">Chưa có dữ liệu điểm danh.</p></div>'}
  <footer>Liên kết này dành riêng cho phụ huynh của bé, vui lòng không chia sẻ công khai.</footer></div>`}

/* ---------- csv ---------- */
const csv=rows=>'﻿'+rows.map(r=>r.map(c=>{c=String(c==null?'':c);return/[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\n');
function dl(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const SL={P:'Có mặt',L:'Muộn',E:'Có phép',A:'Vắng'};
async function putAtt(d,m){try{await API.call('PUT','attendance/'+d,{marks:m})}catch(e){toast('Không lưu được điểm danh: '+e.message)}}
async function putNote(d,uid,v){try{await API.call('PUT','attendance/'+d,{notes:{[uid]:v}});toast(v?'Đã lưu nhận xét':'Đã xóa nhận xét')}catch(e){toast('Không lưu được nhận xét: '+e.message)}}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-qp],[data-grade],[data-act],[data-tab],[data-go],[data-sel],[data-mark],[data-say],[data-rec],[data-recskip],[data-recretry],[data-recplay],[data-vplay],[data-vsave],[data-vdel],[data-vf],[data-vreload],[data-dlg],[data-flip],[data-bt],[data-br],[data-wc],[data-reset],[data-delas],[data-delcls],[data-tabx],[data-ie]');if(!t)return;
  const D=t.dataset;
  if(D.ie!==undefined){ieClick(t,D);return}
  if(D.qp!==undefined){const k=D.qp.toLowerCase();document.querySelectorAll('input[name=as-e]').forEach(c=>{if(!k)c.checked=false;else if(c.parentElement.textContent.toLowerCase().includes(k))c.checked=true});asRecount();return}
  if(D.rec!==undefined){toggleRec(+D.rec);return}
  if(D.recretry!==undefined){const i=+D.recretry,k=X.E.id+':'+i;if(RB[k])uploadRec(X.E.id,i,RB[k],(X.E.items[i].prompt||X.E.items[i].w)+'');return}
  if(D.recplay!==undefined){const i=+D.recplay,k=X.E.id+':'+i;t.disabled=true;audioUrl(S.uid,X.E.id,i).then(u=>{REC[k]=u;refreshItem(i)}).catch(er=>{toast(er.message);t.disabled=false});return}
  if(D.vplay){const[who,eid,i]=D.vplay.split('|');const k=who+'|'+eid+'|'+i;t.disabled=true;(VA[k]?Promise.resolve(VA[k]):audioUrl(who,eid,i)).then(u=>{VA[k]=u;t.insertAdjacentHTML('afterend',`<audio controls autoplay src="${u}" style="margin-left:8px"></audio>`);t.remove()}).catch(er=>{toast(er.message);t.disabled=false});return}
  if(D.vsave){const[who,eid,i]=D.vsave.split('|');const box=document.querySelector('[data-vc="'+D.vsave+'"]');const txt=box?box.value.trim():'';t.disabled=true;
    API.call('PUT','rec/comment/'+encodeURIComponent(who)+'/'+eid+'/'+i,{comment:txt}).then(r=>{const it=(S.vlist||[]).find(x=>x.user===who&&x.key===eid+':'+i);if(it)Object.assign(it,r.meta);toast(txt?'Đã lưu nhận xét. Học sinh sẽ thấy ngay.':'Đã xóa nhận xét.');t.textContent='Đã lưu ✓';setTimeout(()=>{t.disabled=false;t.textContent='Lưu nhận xét'},1500)}).catch(er=>{toast(er.message);t.disabled=false});return}
  if(D.vdel){const[who,eid,i]=D.vdel.split('|');if(!confirm('Xóa bản thu này?'))return;API.call('DELETE','rec/'+encodeURIComponent(who)+'/'+eid+'/'+i).then(()=>{S.vlist=(S.vlist||[]).filter(x=>!(x.user===who&&x.key===eid+':'+i));render()}).catch(er=>toast(er.message));return}
  if(D.vf!==undefined){S.vf=D.vf;render();return}
  if(D.vreload!==undefined){S.vlist=null;render();return}
  if(D.recskip!==undefined){e.preventDefault();X.ans[+D.recskip]=true;refreshItem(+D.recskip);return}
  if(D.dlg!==undefined){if(D.dlg==='stop'){DLGTOK++;try{speechSynthesis.cancel()}catch(_){}}else playDlg(X.E.items[+D.dlg].lines);return}
  if(D.flip!==undefined){t.classList.toggle('flip');return}
  if(D.bt||D.br){const[i,k]=(D.bt||D.br).split(':').map(Number);const a=Array.isArray(X.ans[i])?X.ans[i].slice():[];if(D.bt)a.push(k);else{const p=a.indexOf(k);if(p>=0)a.splice(p,1)}X.ans[i]=a;refreshItem(i);return}
  if(D.wc){const[i,r,c]=D.wc.split(':').map(Number);const it=X.E.items[i];const sel=X.wsSel;
    if(!sel||sel.i!==i||(sel.r===r&&sel.c===c)){X.wsSel=(sel&&sel.i===i&&sel.r===r&&sel.c===c)?null:{i,r,c};refreshItem(i);return}
    const dr=Math.sign(r-sel.r),dc=Math.sign(c-sel.c),len=Math.max(Math.abs(r-sel.r),Math.abs(c-sel.c))+1;
    if(!(dr===0||dc===0||Math.abs(r-sel.r)===Math.abs(c-sel.c))){X.wsSel={i,r,c};refreshItem(i);return}
    let w='';for(let n=0;n<len;n++)w+=it.grid[sel.r+dr*n][sel.c+dc*n];w=w.toLowerCase();const rv=[...w].reverse().join('');
    const hit=it.words.find(x=>x===w||x===rv);const f=Array.isArray(X.ans[i])?X.ans[i].slice():[];
    if(hit&&!f.includes(hit)){f.push(hit);X.ans[i]=f;X.wsSel=null;toast('Tìm thấy: '+hit)}else X.wsSel={i,r,c};
    refreshItem(i);return}
  if(D.grade){setGrade(+D.grade);X=null;S.tab='vocab';S.cls='';const h=S.isT?'t-home':'home';if(location.hash.slice(1)!==h)location.hash=h;render();scrollTo(0,0);return}
  if(D.tab){S.tab=D.tab;render();return}
  if(D.tabx){S.tab='ex';return}
  if(D.go){location.hash=D.go;return}
  if(D.sel){S.sel=D.sel;if(location.hash==='#t-student')render();else location.hash='t-student';return}
  if(D.say){try{DLGTOK++;speechSynthesis.cancel();const male=D.g==='m';speechSynthesis.speak(mkUtt(D.say,male,D.rate?+D.rate:.8))}catch(_){}return}
  if(D.mark){const[uid,k]=D.mark.split('|');const d=S.date;const m=Object.assign({},S.att[d]||{});if(m[uid]===k)delete m[uid];else m[uid]=k;S.att[d]=m;render();putAtt(d,m);return}
  if(D.reset){const p=S.all[S.sel];if(!p)return;if(!confirm('Cho học sinh làm lại bài này? Kết quả cũ sẽ bị xóa và lần làm tới được tính là lần đầu.'))return;delete p.ex[D.reset];render();try{await API.call('PUT','students/'+encodeURIComponent(S.sel)+'/progress',{resetEx:D.reset});toast('Đã cho học sinh làm lại bài')}catch(err){toast(err.message)}return}
  if(D.delas!=null){cfgOp({op:'delas',id:D.delas});return}
  if(D.delcls){cfgOp({op:'classes',classes:(S.cfg.classes||[]).filter(c=>c!==D.delcls)});return}
  const act=D.act;
  if(act==='login'||act==='setup'){const u=($('#lg-user').value||'').trim().toLowerCase(),pw=$('#lg-pass').value||'';const er=$('#lg-err');er.textContent='';t.disabled=true;
    try{const body=act==='login'?{username:u,password:pw,mode:S.loginMode==='ta'?'ta':'main'}:{name:$('#lg-name').value,username:u,password:pw,code:$('#lg-code')?$('#lg-code').value:''};
      const r=await API.call('POST',act==='login'?'login':'setup',body);API.tok=r.token;lsSet(TK,r.token);S.fail='';
      applyMe(await API.call('GET','me'));if(S.isT)await loadTeacher();initGrade();S.needSetup=false;location.hash='';render();scrollTo(0,0)}
    catch(err){er.textContent=err.message;t.disabled=false}return}
  if(act==='logout'){logout();return}
  if(act==='chpw'){try{await API.call('POST','password',{old:$('#pw-old').value,password:$('#pw-new').value});$('#pw-old').value='';$('#pw-new').value='';toast('Đã đổi mật khẩu')}catch(err){toast(err.message)}return}
  if(act==='check')doCheck();
  else if(act==='check2')doCheck(true);
  else if(act==='cancelcheck'){X.confirm=false;const b=$('.actbar');if(b)b.outerHTML=actbar()}
  else if(act==='practice'){startEx(X.E.id,true);render();scrollTo(0,0)}
  else if(act==='endpractice'){X=null;render();scrollTo(0,0)}
  else if(act==='retry'){X.checked=false;X.show=false;X.ans=X.E.items.map(()=>undefined);X.g=null;render();scrollTo(0,0)}
  else if(act==='reveal'){collect();X.show=!X.show;X.g=null;render()}
  else if(act==='checkin'){const v=($('#ci-code').value||'').trim();try{const r=await API.call('POST','checkin',{code:v});S.prof.ci=r.ci;toast('Điểm danh thành công');render()}catch(err){toast(err.message)}}
  else if(act==='openci'){if(S.date!==today()){toast('Chỉ mở điểm danh bằng mã cho ngày hôm nay.');return}if(S.isTA&&!(S.cfg.classes||[]).length){toast('Bạn chưa được phân công lớp nào.');return}cfgOp({op:'ci',code:String(Math.floor(1000+Math.random()*9000)),classes:S.isTA&&S.cls?[S.cls]:[]})}
  else if(act==='closeci'){cfgOp({op:'ci',code:'',classes:S.isTA&&S.cls?[S.cls]:[]})}
  else if(act==='allP'){const m=Object.assign({},S.att[S.date]||{});visibleStudents().forEach(x=>{if(!m[x.uid])m[x.uid]='P'});S.att[S.date]=m;render();putAtt(S.date,m)}
  else if(act==='addas'){const ti=($('#as-t').value||'').trim();const exs=[...document.querySelectorAll('input[name=as-e]:checked')].map(x=>x.value);const ls=[...new Set(exs.map(id=>S.exL[id]))];if(!ti||!exs.length){toast('Nhập tiêu đề và chọn ít nhất một phần bài tập');return}
    const ac=$('#as-c').value;if(S.isTA&&!ac){toast('Hãy chọn lớp bạn phụ trách');return}
    cfgOp({op:'addas',a:{id:Date.now().toString(36),title:ti,lessons:ls,ex:exs,cls:ac,due:$('#as-d').value||''}}).then(()=>toast('Đã giao bài'))}
  else if(act==='saveann'){cfgOp({op:'ann',text:($('#ann').value||'').trim()}).then(()=>toast('Đã lưu thông báo'))}
  else if(act==='addcls'){const v=($('#newcls').value||'').trim();if(v&&!(S.cfg.classes||[]).includes(v))cfgOp({op:'classes',classes:(S.cfg.classes||[]).concat([v])})}
  else if(act==='lm'){S.loginMode=D.m==='ta'?'ta':'main';S.fail='';try{history.replaceState(null,'',S.loginMode==='ta'?'#tro-giang':location.pathname+location.search)}catch(_){}render()}
  else if(act==='copy'){copyText(D.v||'')}
  else if(act==='ptok'){const u=S.sel,p=S.all[u];if(!p)return;if(p.ptoken&&!confirm('Tạo liên kết mới? Liên kết cũ phụ huynh đang dùng sẽ không xem được nữa.'))return;try{const r=await API.call('POST','students/'+encodeURIComponent(u)+'/ptoken',{});p.ptoken=r.ptoken;render();toast('Đã tạo liên kết cho phụ huynh')}catch(err){toast(err.message)}}
  else if(act==='ptokoff'){const u=S.sel,p=S.all[u];if(!p||!confirm('Tắt liên kết? Phụ huynh sẽ không xem được nữa cho đến khi bạn tạo liên kết mới.'))return;try{await API.call('DELETE','students/'+encodeURIComponent(u)+'/ptoken');p.ptoken='';render()}catch(err){toast(err.message)}}
  else if(act==='rep'){const u=S.sel,p=S.all[u],L=S.by[D.l];if(!p||!L)return;const note=(document.querySelector('[data-rnote="'+D.l+'"]')||{}).value||'';t.disabled=true;
    try{if(!p.ptoken){const r0=await API.call('POST','students/'+encodeURIComponent(u)+'/ptoken',{});p.ptoken=r0.ptoken}
      const r=await API.call('POST','students/'+encodeURIComponent(u)+'/report',{lessonId:L.id,label:L.label,unit:L.unit?('Unit '+L.unit+' · '+(L.unitTitle||'')):(L.unitTitle||''),exs:L.exercises.map(E=>({id:E.id,title:E.title})),note});
      p.reports=p.reports||{};p.reports[L.id]=Object.assign({note},r.report);S.openL[L.id]=true;render();toast('Đã báo điểm. Bấm "Sao chép tin nhắn" để gửi cho phụ huynh.')}
    catch(err){toast(err.message);t.disabled=false}}
  else if(act==='repdel'){const u=S.sel,p=S.all[u];if(!p||!confirm('Gỡ báo cáo này khỏi trang phụ huynh?'))return;try{await API.call('DELETE','students/'+encodeURIComponent(u)+'/report/'+encodeURIComponent(D.l));delete (p.reports||{})[D.l];S.openL[D.l]=true;render()}catch(err){toast(err.message)}}
  else if(act==='repcopy'){const p=S.all[S.sel],L=S.by[D.l];if(p&&L)copyText(repMsg(p,L).replace(/\\n/g,'\n'))}

    try{const r=await API.call('POST','staff',{name,classes:cls});S.taCred=r.created;S.staff=null;render()}catch(err){toast(err.message);t.disabled=false}}
  else if(act==='tacls'){const cls=[...document.querySelectorAll('input[name="tac-'+D.u+'"]:checked')].map(x=>x.value);try{await API.call('PATCH','staff/'+encodeURIComponent(D.u),{classes:cls});const x=(S.staff||[]).find(y=>y.username===D.u);if(x)x.classes=cls;toast('Đã lưu lớp phụ trách')}catch(err){toast(err.message)}}
  else if(act==='tapw'){if(!confirm('Cấp mật khẩu mới cho trợ giảng này?'))return;try{const r=await API.call('POST','staff/'+encodeURIComponent(D.u)+'/password',{});const x=(S.staff||[]).find(y=>y.username===D.u);S.taCred={username:r.username,password:r.password,name:x?x.name:'',classes:x?x.classes:[],reset:true};render();scrollTo(0,0)}catch(err){toast(err.message)}}
  else if(act==='tadel'){if(!confirm('Xóa tài khoản trợ giảng này? Bài đã giao và nhận xét vẫn được giữ.'))return;try{await API.call('DELETE','staff/'+encodeURIComponent(D.u));S.staff=null;render()}catch(err){toast(err.message)}}
  else if(act==='closetacred'){S.taCred=null;render()}
  else if(act==='addstu'){const list=($('#stu-list').value||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const[n,c,g]=l.split(/[;\t]/);return{name:(n||'').trim(),cls:(c||'').trim(),grade:(g||'').trim()}});if(!list.length){toast('Nhập ít nhất một học sinh');return}
    t.disabled=true;try{const r=await API.call('POST','students',{list});S.creds=r.created;await loadTeacher();render();scrollTo(0,0)}catch(err){toast(err.message);t.disabled=false}}
  else if(act==='closec'){S.creds=null;render()}

    st.forEach(x=>{const o=overall(x.p);rows.push([x.p.name,x.uid,x.p.cls,o.done,o.total,Math.round(o.pct*100),o.avg==null?'':Math.round(o.avg*100),x.p.last?new Date(x.p.last).toLocaleString('vi-VN'):''].concat(S.lessons.map(L=>{const s=lessonStat(x.p,L);return s.avg==null?'':Math.round(s.avg*100)})))});dl('tien-do-hoc-sinh.csv',csv(rows))}
  else if(act==='exporta'){const days=Object.keys(S.att).sort();const st=visibleStudents();const rows=[['Họ tên','Lớp'].concat(days.map(fmtD))];st.forEach(x=>rows.push([x.p.name,x.p.cls].concat(days.map(d=>SL[attOf(x.uid,d)]||''))));dl('diem-danh.csv',csv(rows))}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.dl)S.openL[d.dataset.dl]=d.open},true);
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset&&t.dataset.note!=null){const d=S.date,v=t.value.trim();S.notes[d]=Object.assign({},S.notes[d]);if(v)S.notes[d][t.dataset.note]=v;else delete S.notes[d][t.dataset.note];putNote(d,t.dataset.note,v);return}
