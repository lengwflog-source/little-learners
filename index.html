<style>

  --shadow:0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{

.pics.book{display:grid;gap:10px}.pics.book img{max-height:none;width:100%;max-width:760px;height:auto}.vimg{display:grid;gap:10px;margin-bottom:14px}.vimg img{width:100%;max-width:820px;border-radius:16px;border:1px solid var(--line);background:#fff}.audiobox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sky);border-radius:16px;padding:12px 16px;margin-bottom:14px}.audiobox audio{flex:1;min-width:220px;max-width:100%}.audiobox b{font-size:.95rem}details.script{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 16px;margin-top:14px}details.script summary{cursor:pointer;font-weight:800;color:var(--primary-deep)}details.script div{margin-top:8px;font-size:.95rem;line-height:1.7}.gseg{display:inline-flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden;flex:none}.gseg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:800;font-size:.82rem;color:var(--muted)}.gseg button.on{background:var(--primary);color:var(--primary-ink)}.blank.wide{display:block;width:100%;margin-top:4px}footer{padding-block:30px 40px;color:var(--muted);font-size:.84rem;text-align:center}

/* ---------- data helpers ---------- */
const gOf=p=>(p&&+p.grade===4)?4:6;
const LG=g=>S.lessons.filter(L=>(L.grade||6)===g);
const curG=()=>S.isT?S.tg:gOf(S.prof);
const uName=L=>L.uname||(L.unit?'Unit '+L.unit:'Đề ôn tập HK1');
const uPre=L=>uName(L)+' · ';
const uShort=L=>L.uname?(L.uname.replace('Unit ','U').replace('Review ','R'))+' · ':(L.unit?'U'+L.unit+' · ':'');
const lessonUnits=()=>{const g=[];LG(curG()).forEach(L=>{const k=(L.grade||6)+'-'+L.unit;let u=g.find(x=>x.key===k);if(!u){u={key:k,ik:(L.grade===4?[4,5,6,0][g.length%4]:L.unit),title:uName(L),sub:L.uname?L.unitTitle:(L.unit?L.unitTitle:'Ôn luyện cuối kì'),lessons:[]};g.push(u)}u.lessons.push(L)});return g};
const exArr=p=>(p&&p.ex)||{};
function lessonStat(p,L){const ex=exArr(p);let done=0,sum=0,cnt=0;for(const E of L.exercises){const r=ex[E.id];if(r){done++;if(r.n>0){sum+=r.c/r.n;cnt++}}}const total=L.exercises.length;return{done,total,pct:total?done/total:0,avg:cnt?sum/cnt:null}}
function overall(p){let done=0,total=0,sum=0,cnt=0;const ex=exArr(p);for(const L of LG(gOf(p)))for(const E of L.exercises){total++;const r=ex[E.id];if(r){done++;if(r.n>0){sum+=r.c/r.n;cnt++}}}return{done,total,pct:total?done/total:0,avg:cnt?sum/cnt:null}}
function streak(p){const d=new Set((p&&p.days)||[]);let n=0;const x=new Date();if(!d.has(dstr(x)))x.setDate(x.getDate()-1);while(d.has(dstr(x))){n++;x.setDate(x.getDate()-1)}return n}
const exTitle=E=>E.title;
function nextEx(p){const ex=exArr(p);let last=null,lt=0;for(const id in ex){if(ex[id].t>lt){lt=ex[id].t;last=id}}
  const order=[];LG(gOf(p)).forEach(L=>L.exercises.forEach(E=>order.push(E.id)));
  let start=last?order.indexOf(last)+1:0;for(let k=0;k<order.length;k++){const id=order[(start+k)%order.length];if(!ex[id])return id}return null}
function visibleStudents(){return Object.entries(S.all).map(([uid,p])=>({uid,p})).filter(x=>gOf(x.p)===S.tg&&(!S.cls||x.p.cls===S.cls)).sort((a,b)=>(a.p.name||'').localeCompare(b.p.name||'','vi'))}
function myAssignments(){const c=S.prof&&S.prof.cls,g=gOf(S.prof);return(S.cfg.assignments||[]).filter(a=>(a.grade||6)===g&&(!a.cls||a.cls===c))}
function assignStat(p,a){let done=0,total=0;const ex=exArr(p);for(const id of a.lessons||[]){const L=S.by[id];if(!L)continue;for(const E of L.exercises){total++;if(ex[E.id])done++}}return{done,total,pct:total?done/total:0}}

/* ---------- grading ---------- */
const norm=s=>String(s==null?'':s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim();
const loose=s=>norm(s).replace(/[.,!?;:"]/g,'').replace(/\s+/g,' ').trim();
const same=(a,b)=>loose(a)===loose(b);
const exp4=s=>' '+loose(s).replace(/-/g,' ').replace(/\bviet nam\b/g,'vietnam').replace(/favorite/g,'favourite').replace(/\bcan't\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\bwon't\b/g,'will not').replace(/n't\b/g,' not').replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'s\b/g,' is').replace(/'ll\b/g,' will').replace(/\s+/g,' ').trim();
const same4=(a,b)=>exp4(a)===exp4(b);
let LEN=false;const eq=(a,b)=>LEN?same4(a,b):same(a,b);
function units(it){switch(it.t){case'mcq':case'tf':case'text':return 1;case'fill':return it.a.length;case'order':return it.steps.length;case'match':return it.left.length;case'cat':return it.words.length;default:return 0}}
function gradeItem(it,a){switch(it.t){
  case'mcq':return[a===it.a];
  case'tf':return[a===it.a];
  case'text':return[it.a.some(v=>eq(v,a))];
  case'fill':return it.a.map((vs,k)=>vs.some(v=>eq(v,(a||[])[k])));
  case'order':return it.steps.map((_,k)=>Number((a||[])[k])===it.a.indexOf(k)+1);
  case'match':case'cat':return it.a.map((v,k)=>String((a||[])[k])===String(v));
  default:return null}}
function gradeEx(E,ans){LEN=((S.by[S.exL[E.id]]||{}).grade===4);let c=0,n=0;const res=E.items.map((it,i)=>{const g=gradeItem(it,ans[i]);if(g){n+=g.length;c+=g.filter(Boolean).length}return g});return{res,c,n}}
function solText(it){switch(it.t){
  case'mcq':return it.opts[it.a];
  case'tf':return it.lab?(it.a==='T'?it.lab[0]:it.lab[1]):(it.a==='T'?'True':it.a==='F'?'False':'Not given');
  case'text':return it.a[0];
  case'fill':return it.a.map(v=>v[0]).join(' · ');
  case'order':return it.steps.map((_,k)=>(k+1)+'→'+(it.a.indexOf(k)+1)).join('  ');
  case'match':return it.left.map((l,k)=>(k+1)+'-'+L2[it.a[k]]).join('  ');
  case'cat':return it.words.map((w,k)=>w+' → '+it.cats[it.a[k]]).join('; ');
  default:return it.sample||''}}

/* ---------- persistence ---------- */
const LKEY='ll-english6-local';
function toast(m){const t=$('#toast');t.className='toast';t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}
function saveProf(){dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,150)}
async function flush(){
  if(!S.prof||!dirty)return;if(saving){setTimeout(flush,400);return}
  dirty=false;saving=true;S.prof.last=Date.now();
  try{const data=JSON.parse(JSON.stringify(S.prof));
    if(S.local){try{localStorage.setItem(LKEY,JSON.stringify(data))}catch(e){}}
    else await S.db.doc('progress/'+S.uid).set(data);
    S.fail='';
  }catch(e){S.fail=(e&&e.code==='not_granted')||(e&&/permission|denied|not_granted/i.test(e.message||''))?'Tài khoản của bạn chưa có quyền lưu bài. Nhờ giáo viên cấp quyền tương tác (Contributor).':'Chưa lưu được tiến trình: '+((e&&e.message)||'lỗi kết nối');toast(S.fail)}
  saving=false;if(dirty)flush();
}
async function putCfg(patch){Object.assign(S.cfg,patch);const data=JSON.parse(JSON.stringify(S.cfg));try{await S.db.doc('config/main').set(data);}catch(e){toast('Không lưu được cài đặt')}refresh()}

function refresh(force){const a=document.activeElement;
  if(!force&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#app').contains(a)){pending=true;return}
  if(!force&&route().startsWith('ex-'))return;
  pending=false;render()}
document.addEventListener('focusout',()=>{if(pending)setTimeout(()=>{if(!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))refresh(true)},120)});

/* ---------- init ---------- */
async function init(){
  render();
  try{const [r6,r4]=await Promise.all([fetch('lessons.json'),fetch('lessons4.json')]);const l6=await r6.json();l6.forEach(L=>{if(!L.grade)L.grade=6});let l4=[];try{l4=await r4.json()}catch(_){}S.lessons=l4.concat(l6)}catch(e){$('#app').innerHTML='<div class="wrap"><div class="banner err">Không tải được dữ liệu bài học. Hãy tải lại trang.</div></div>';return}
  S.lessons.forEach(L=>{S.by[L.id]=L;L.exercises.forEach(E=>{S.exL[E.id]=L.id})});
  const C=window.claude;
  if(C&&C.use){try{S.user=await C.use('user')}catch(e){}try{S.db=await C.use('db')}catch(e){}}
  if(S.user){try{S.uid=await S.user.id();S.isT=await S.user.canEdit()}catch(e){}}
  if(!S.db||!S.uid){S.local=true;S.uid='local';S.isT=false;try{S.prof=JSON.parse(localStorage.getItem(LKEY)||'null')}catch(e){}S.profLoaded=true;S.ready=true;render();return}
  let first=true;
  S.db.doc('config/main').onSnapshot(s=>{const d=s.exists?s.data():{};S.cfg=Object.assign({classes:[],assignments:[],announcement:'',checkin:null},d);refresh()},()=>{});
  S.db.collection('attendance').onSnapshot(q=>{S.att={};q.docs.forEach(d=>S.att[d.id]=(d.data()||{}).marks||{});refresh()},()=>{});
  if(S.isT){S.db.collection('progress').onSnapshot(q=>{S.all={};q.docs.forEach(d=>S.all[d.id]=d.data());S.profLoaded=true;if(!S.ready){S.ready=true;render()}else refresh()},e=>{S.fail='Không đọc được danh sách học sinh.';S.ready=true;render()})}
  else S.db.doc('progress/'+S.uid).onSnapshot(s=>{if(S.profLoaded&&(saving||dirty))return;S.prof=s.exists?s.data():null;if(S.prof&&!S.prof.ex)S.prof.ex={};S.profLoaded=true;if(!S.ready){S.ready=true;render()}else refresh()},e=>{S.fail='Không đọc được tiến trình của bạn.';S.ready=true;render()});
  setTimeout(()=>{if(!S.ready){S.ready=true;S.profLoaded=true;render()}},9000);
}

/* ---------- routing ---------- */
const route=()=>{const h=(location.hash||'').slice(1);return h||(S.isT?'t-home':'home')};
addEventListener('hashchange',()=>{scrollTo(0,0);render()});
const hdr=()=>{const r=route(),I=(h,t,on)=>`<a href="#${h}" class="${on?'on':''}">${t}</a>`;
  const nav=S.isT?I('t-home','Tổng quan',r==='t-home')+I('t-students','Học sinh',r.startsWith('t-student'))+I('t-attendance','Điểm danh',r==='t-attendance')+I('t-assign','Giao bài',r==='t-assign')+I('lessons','Bài học',r==='lessons'||r.startsWith('lesson-')||r.startsWith('ex-')):
    I('home','Trang chủ',r==='home')+I('lessons','Bài học',r==='lessons'||r.startsWith('lesson-')||r.startsWith('ex-'))+I('progress','Tiến độ',r==='progress');
  const nm=S.isT?'Giáo viên':(S.prof&&S.prof.name)||'';const gsel=S.isT?`<div class="gseg" role="group" aria-label="Chọn khối">${[4,6].map(g=>`<button class="${S.tg===g?'on':''}" data-grade="${g}">Lớp ${g}</button>`).join('')}</div>`:`<span class="chip">Lớp ${gOf(S.prof)}</span>`;
  return`<header class="top"><div class="wrap"><a class="brand" href="#${S.isT?'t-home':'home'}">${LOGO}<div><b>Little Learners</b><span>Tiếng Anh ${S.ready&&(S.isT||S.prof)?curG():'4 & 6'} · Global Success</span></div></a>${S.ready&&(S.isT||S.prof)?`<nav class="nav" aria-label="Menu chính">${nav}</nav><div class="who">${gsel}<span class="avatar" aria-hidden="true">${esc((nm[0]||'?').toUpperCase())}</span><span>${esc(nm)}</span>${S.isT?'':'<button class="btn ghost sm" data-act="editprof">Hồ sơ</button>'}</div>`:''}</div></div></header>`};

function render(){
  const r=route();let body='';
  if(!S.ready||!S.lessons.length)body=`<div class="wrap" style="padding-block:40px"><div class="sk"></div><div class="grid g3" style="margin-top:16px"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>`;
  else if(!S.isT&&(!S.prof||S.editing))body=welcomeView();
  else{
    if(r==='home')body=S.isT?teacherHome():homeView();
    else if(r==='lessons')body=lessonsView();
    else if(r==='progress')body=progressView();
    else if(r.startsWith('lesson-'))body=lessonView(r.slice(7));
    else if(r.startsWith('ex-'))body=exView(r.slice(3));
    else if(r==='t-home'&&S.isT)body=teacherHome();
    else if(r==='t-students'&&S.isT)body=studentsView();
    else if(r==='t-student'&&S.isT)body=studentDetail();
    else if(r==='t-attendance'&&S.isT)body=attendanceView();
    else if(r==='t-assign'&&S.isT)body=assignView();
    else body=S.isT?teacherHome():homeView();
  }
  const keepY=scrollY;
  $('#app').innerHTML=hdr()+(S.local&&S.ready?`<div class="wrap"><div class="banner">Chế độ dùng thử: tiến trình chỉ lưu trên thiết bị này. Mở trang qua liên kết giáo viên chia sẻ để lưu chung với lớp.</div></div>`:'')+(S.fail&&S.ready?`<div class="wrap"><div class="banner err">${esc(S.fail)}</div></div>`:'')+body+`<footer><div class="wrap">Little Learners · Tiếng Anh ${S.ready&&(S.isT||S.prof)?curG():'4 & 6'} · Học kì 1</div></footer>`;
  if(r.startsWith('ex-')===false)scrollTo(0,keepY);
}

function lessonView(id){const L=S.by[id];if(!L)return`<div class="wrap" style="padding-block:40px"><p>Không tìm thấy bài học. <a href="#lessons">Quay lại</a></p></div>`;

  else if(tab==='gram')c=L.grammar.map(g=>`<div class="prose" style="margin-bottom:14px">${g.title?`<h3>${esc(g.title)}</h3>`:''}${g.html}</div>`).join('');

function startEx(id){const L=S.by[S.exL[id]];if(!L)return;const E=L.exercises.find(e=>e.id===id);const p=S.isT?null:S.prof;const r=p&&p.ex&&p.ex[id];
  X={E,L,ans:r?JSON.parse(JSON.stringify(r.a||[])):E.items.map(()=>undefined),checked:!!r,show:false};if(r)X.g=gradeEx(E,X.ans)}
function exView(id){if(!X||X.E.id!==id)startEx(id);if(!X)return`<div class="wrap" style="padding:40px 16px"><p>Không tìm thấy bài tập. <a href="#lessons">Quay lại</a></p></div>`;
  const{E,L}=X;const reveal=X.checked||X.show;const g=reveal?(X.g||gradeEx(E,X.ans)):null;
  const idx=L.exercises.indexOf(E),nx=L.exercises[idx+1];
  return`<div class="wrap" style="padding-block:24px 0"><div class="ex"><div class="crumb"><a href="#lessons">Bài học</a> / <a href="#lesson-${L.id}" data-tabx="ex">${esc(L.title)}</a> / ${esc(exTitle(E))}</div>
  <h2>${esc(exTitle(E))}</h2><p class="instr">${E.instruction||''}</p>
  ${E.box?`<div class="boxw">${E.box.map(w=>`<span>${esc(w)}</span>`).join('')}</div>`:''}
  ${E.audio?`<div class="audiobox"><b>🎧 Nghe bài</b><audio controls preload="metadata" src="${esc(E.audio)}"></audio></div>`:''}${E.img?`<div class="pics${L.grade===4?' book':''}">${E.img.map(i=>`<img src="img/${esc(i)}" alt="Hình minh họa trong sách" loading="lazy">`).join('')}</div>`:''}
  ${E.passage?`<div class="passage">${E.passage}</div>`:''}
  ${E.items.map((it,i)=>itemHtml(it,i,reveal,g&&g.res[i])).join('')}
  ${X.checked&&g?`<div class="result"><b>${g.c}/${g.n}</b><div><b style="font-size:1.05rem;font-family:var(--body)">${g.n?(g.c/g.n>=.9?'Xuất sắc!':g.c/g.n>=.7?'Làm tốt lắm!':g.c/g.n>=.5?'Khá rồi, thử lại để cao hơn nhé.':'Đọc lại bài và thử lần nữa nhé.'):'Đã hoàn thành'}</b><div class="small muted">Điểm đã được lưu${S.isT?' (chế độ xem của giáo viên không lưu)':''}.</div></div></div>`:''}
  ${E.script&&(X.checked||S.isT)?`<details class="script"><summary>Lời thoại bài nghe (Tapescript)</summary><div>${E.script}</div></details>`:E.script?`<p class="small muted" style="margin-top:12px">Lời thoại bài nghe sẽ hiện sau khi nộp bài.</p>`:''}<div class="actbar">${X.checked?`<button class="btn ghost" data-act="retry">Làm lại</button>`:`<button class="btn" data-act="check">${S.isT?'Chấm thử':'Nộp bài'}</button>`}${S.isT&&!X.checked?`<button class="btn ghost" data-act="reveal">${X.show?'Ẩn đáp án':'Hiện đáp án'}</button>`:''}<span class="sp"></span>${nx?`<a class="btn ${X.checked?'':'ghost'}" href="#ex-${nx.id}">Bài kế tiếp →</a>`:`<a class="btn ${X.checked?'':'ghost'}" href="#lesson-${L.id}" data-tabx="ex">Về danh sách bài</a>`}</div></div></div>`}

function qText(it,i,done,res){const q=it.q||'';let k=0;
  if(it.t==='fill'){const ans=X.ans[i]||[];const sz=j=>Math.min(28,Math.max(7,Math.max(...it.a[j].map(s=>s.length))+3));
    const wide=j=>Math.min(...it.a[j].map(s=>s.length))>22;const mk=j=>`<input class="blank ${wide(j)?'wide':''} ${done&&res?(res[j]?'ok-in':'bad-in'):''}" data-i="${i}" data-k="${j}" size="${sz(j)}" value="${esc(ans[j]||'')}" ${done?'disabled':''} autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Chỗ trống ${j+1}">`;
    if(q.includes('___'))return q.replace(/___/g,()=>mk(k++));
    return q+' '+mk(0)}
  return q}
function itemHtml(it,i,done,res){const a=X.ans[i];const ok=res?res.every(Boolean):null;
  const noq=!it.q&&!it.img&&['match','cat','order'].includes(it.t);
  const head=noq?'':`<div class="q"><span class="num">${i+1}</span><div>${it.img?`<img src="img/${esc(it.img)}" alt="" loading="lazy" style="display:block;margin-bottom:8px">`:''}${qText(it,i,done,res)}${it.hint&&it.t!=='text'?` <span class="hint">${esc(it.hint)}</span>`:''}</div></div>`;
  let body='';
  if(it.t==='mcq')body=`<div class="opts">${it.opts.map((o,j)=>`<label class="opt ${a===j&&!done?'sel':''} ${done&&j===it.a?'ok':''} ${done&&a===j&&j!==it.a?'bad':''}"><input type="radio" name="q${i}" data-i="${i}" value="${j}" ${a===j?'checked':''} ${done?'disabled':''}><span class="L">${L2[j]}</span><span>${o}</span></label>`).join('')}</div>`;
  else if(it.t==='tf'){const o=it.lab?[['T',it.lab[0]],['F',it.lab[1]]]:it.ng?[['T','True'],['F','False'],['NG','Not given']]:[['T','True'],['F','False']];body=`<div class="tfs">${o.map(([v,t])=>`<label class="opt ${a===v&&!done?'sel':''} ${done&&v===it.a?'ok':''} ${done&&a===v&&v!==it.a?'bad':''}"><input type="radio" name="q${i}" data-i="${i}" value="${v}" ${a===v?'checked':''} ${done?'disabled':''}><span>${t}</span></label>`).join('')}</div>`}
  else if(it.t==='text')body=`<textarea class="txt ${done?(ok?'ok-in':'bad-in'):''}" rows="2" data-i="${i}" placeholder="${esc(it.hint||'Viết câu trả lời của bạn…')}" ${done?'disabled':''}>${esc(a||'')}</textarea>`;
  else if(it.t==='open')body=`<textarea class="txt" rows="3" data-i="${i}" placeholder="Viết câu trả lời của bạn…" ${done?'':''}>${esc(a||'')}</textarea>${done?`<div class="sol">Gợi ý: ${esc(it.sample||'')}</div>`:''}`;
  else if(it.t==='order')body=`<div>${it.steps.map((s,k)=>`<div class="ordrow"><select class="sel-in ${done&&res?(res[k]?'ok-in':'bad-in'):''}" data-i="${i}" data-k="${k}" ${done?'disabled':''}><option value="">–</option>${it.steps.map((_,n)=>`<option value="${n+1}" ${Number((a||[])[k])===n+1?'selected':''}>${n+1}</option>`).join('')}</select><span>${s}</span></div>`).join('')}</div>`;
  else if(it.t==='match')body=`<div class="mright">${it.right.map((r,j)=>`<div><b>${L2[j]}.</b> ${r}</div>`).join('')}</div>`+it.left.map((l,k)=>`<div class="mrow"><span><b>${k+1}.</b> ${l}</span><select class="sel-in ${done&&res?(res[k]?'ok-in':'bad-in'):''}" data-i="${i}" data-k="${k}" ${done?'disabled':''}><option value="">–</option>${it.right.map((_,j)=>`<option value="${j}" ${String((a||[])[k])===String(j)?'selected':''}>${L2[j]}</option>`).join('')}</select></div>`).join('');
  else if(it.t==='cat')body=it.words.map((w,k)=>`<div class="mrow"><span><b>${esc(w)}</b></span><select class="sel-in ${done&&res?(res[k]?'ok-in':'bad-in'):''}" data-i="${i}" data-k="${k}" ${done?'disabled':''}><option value="">–</option>${it.cats.map((c,j)=>`<option value="${j}" ${String((a||[])[k])===String(j)?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`).join('');
  const sol=done&&res&&!ok&&it.t!=='open'?`<div class="sol x">Đáp án: ${it.t==='mcq'?esc(String(solText(it)).replace(/<[^>]+>/g,'')):esc(solText(it))}</div>`:'';
  return`<div class="item">${head}${body}${sol}${done&&it.expl?`<div class="expl">${esc(it.expl)}</div>`:''}</div>`}

function collect(){ // read DOM inputs into X.ans (text-like values)
  document.querySelectorAll('#app [data-i]').forEach(el=>{const i=+el.dataset.i,it=X.E.items[i];if(!it)return;
    if(el.type==='radio'){if(el.checked)X.ans[i]=it.t==='mcq'?+el.value:el.value}
    else if(el.dataset.k!=null&&el.dataset.k!==''){const k=+el.dataset.k;if(!Array.isArray(X.ans[i]))X.ans[i]=[];X.ans[i][k]=el.value}
    else X.ans[i]=el.value})}
function doCheck(){collect();X.g=gradeEx(X.E,X.ans);X.checked=true;
  if(S.prof&&!S.isT){const clean=JSON.parse(JSON.stringify(X.ans));S.prof.ex=S.prof.ex||{};S.prof.ex[X.E.id]={c:X.g.c,n:X.g.n,t:Date.now(),a:clean};S.prof.days=S.prof.days||[];const t=today();if(!S.prof.days.includes(t)){S.prof.days.push(t);S.prof.days=S.prof.days.slice(-120)}saveProf()}
  render();scrollTo(0,0)}

function attOf(uid,d){const m=S.att[d]&&S.att[d][uid];if(m)return m;const p=S.all[uid];return p&&p.ci&&p.ci[d]?'P':''}

  return`<div class="wrap" style="padding-block:28px"><div class="sechead"><div><div class="eyebrow">Quản lý</div><h1 style="font-size:clamp(2rem,5vw,2.8rem)">Học sinh</h1></div><div class="row">${clsSel()}<button class="btn ghost sm" data-act="exportp">Xuất CSV</button></div></div>
  ${st.length?`<div class="tw"><table class="t"><thead><tr><th>Họ tên</th><th>Lớp</th><th>Hoàn thành</th><th>Điểm TB</th><th>Hoạt động</th><th>Hôm nay</th></tr></thead><tbody>${st.map(x=>{const o=overall(x.p),a=attOf(x.uid,td);return`<tr class="click" data-sel="${esc(x.uid)}"><td><b>${esc(x.p.name||'Chưa đặt tên')}</b></td><td>${esc(x.p.cls||'')}</td><td style="min-width:150px"><div class="row"><div class="bar"><i style="width:${o.pct*100}%"></i></div><span class="small">${pct(o.pct)}</span></div></td><td>${pct(o.avg)}</td><td class="small muted">${fmtT(x.p.last)}</td><td>${a?`<span class="chip ${a==='P'?'good':a==='L'?'warn':a==='E'?'sky':'bad'}">${{P:'Có mặt',L:'Muộn',E:'Có phép',A:'Vắng'}[a]}</span>`:'<span class="muted">—</span>'}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="card"><p class="muted">Chưa có học sinh nào. Khi học sinh mở liên kết và nhập họ tên, danh sách sẽ hiện ở đây.</p></div>'}</div>`}

function studentDetail(){const p=S.all[S.sel];if(!p)return`<div class="wrap" style="padding:40px 16px"><p>Không tìm thấy học sinh. <a href="#t-students">Quay lại</a></p></div>`;const o=overall(p);const ex=exArr(p);
  const days=Object.keys(S.att).sort();const cnt={P:0,L:0,E:0,A:0};days.forEach(d=>{const a=attOf(S.sel,d);if(a)cnt[a]++});
  return`<div class="wrap" style="padding-block:28px"><div class="crumb"><a href="#t-students">Học sinh</a> / ${esc(p.name||'')}</div><div class="sechead"><div><h1 style="font-size:clamp(2rem,5vw,2.8rem)">${esc(p.name||'Chưa đặt tên')}</h1><p class="muted">Lớp ${esc(p.cls||'—')} · hoạt động cuối ${fmtT(p.last)}</p></div><div class="row"><button class="btn danger sm" data-act="delstu" id="delbtn">Xóa học sinh</button></div></div>
  <div class="grid g4" style="margin-block:16px"><div class="card kpi"><b>${pct(o.pct)}</b><span>Hoàn thành</span></div><div class="card kpi"><b>${pct(o.avg)}</b><span>Điểm trung bình</span></div><div class="card kpi"><b>${streak(p)}</b><span>Ngày học liên tiếp</span></div><div class="card kpi"><b>${cnt.P+cnt.L}/${days.length}</b><span>Buổi có mặt (vắng ${cnt.A}, phép ${cnt.E})</span></div></div>
  ${LG(gOf(p)).map(L=>{const s=lessonStat(p,L);return`<details class="card" style="margin-bottom:10px;padding:14px 18px" ${s.done?'':''}><summary style="cursor:pointer;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><b style="flex:1;min-width:140px">${uPre(L)}${esc(L.title)}</b><span class="small muted">${s.done}/${s.total} bộ</span><span class="chip ${s.avg==null?'':s.avg>=.8?'good':s.avg>=.5?'warn':'bad'}">${pct(s.avg)}</span></summary><div style="margin-top:10px">${L.exercises.map(E=>{const r=ex[E.id];return`<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><span>${esc(exTitle(E))}</span><span class="sp"></span>${r?`<span class="small muted">${fmtT(r.t)}</span><span class="chip ${r.n&&r.c/r.n>=.8?'good':r.n&&r.c/r.n>=.5?'warn':'bad'}">${r.n?r.c+'/'+r.n:'Đã xem'}</span><button class="btn ghost sm" data-reset="${E.id}">Đặt lại</button>`:'<span class="chip">Chưa làm</span>'}</div>`}).join('')}</div></details>`}).join('')}</div>`}

function attendanceView(){const d=S.date,st=visibleStudents(),code=S.cfg.checkin&&S.cfg.checkin.date===d?S.cfg.checkin.code:null;
  const sum={P:0,L:0,E:0,A:0,'':0};st.forEach(x=>sum[attOf(x.uid,d)||'']++);
  return`<div class="wrap" style="padding-block:28px"><div class="sechead"><div><div class="eyebrow">Điểm danh</div><h1 style="font-size:clamp(2rem,5vw,2.8rem)">${fmtD(d)}</h1></div><div class="row"><input type="date" id="attd" class="sel-in" value="${d}" aria-label="Chọn ngày">${clsSel()}</div></div>
  <div class="card" style="margin-bottom:16px"><div class="row"><div><b>Điểm danh bằng mã</b><div class="small muted">Học sinh nhập mã trên trang chủ để tự điểm danh.</div></div><span class="sp"></span>${code?`<span class="codepill">${code}</span><button class="btn ghost sm" data-act="closeci">Đóng mã</button>`:`<button class="btn sm" data-act="openci">Mở điểm danh</button>`}</div></div>
  <div class="row" style="margin-bottom:12px"><span class="chip good">Có mặt ${sum.P}</span><span class="chip warn">Muộn ${sum.L}</span><span class="chip sky">Có phép ${sum.E}</span><span class="chip bad">Vắng ${sum.A}</span><span class="chip">Chưa điểm danh ${sum['']}</span><span class="sp"></span><button class="btn ghost sm" data-act="allP">Tất cả có mặt</button><button class="btn ghost sm" data-act="exporta">Xuất CSV</button></div>
  ${st.length?`<div class="tw"><table class="t"><thead><tr><th>Họ tên</th><th>Lớp</th><th>Trạng thái</th></tr></thead><tbody>${st.map(x=>{const a=attOf(x.uid,d),self=!(S.att[d]&&S.att[d][x.uid])&&a==='P';return`<tr><td><b>${esc(x.p.name||'')}</b>${self?' <span class="chip sky">tự điểm danh</span>':''}</td><td>${esc(x.p.cls||'')}</td><td><div class="seg" role="group">${[['P','Có mặt'],['L','Muộn'],['E','Có phép'],['A','Vắng']].map(([k,t])=>`<button class="${k} ${a===k?'on':''}" data-mark="${esc(x.uid)}|${k}">${t}</button>`).join('')}</div></td></tr>`}).join('')}</tbody></table></div>`:'<div class="card"><p class="muted">Chưa có học sinh trong lớp này.</p></div>'}</div>`}

function assignView(){const cl=S.cfg.classes||[],as=S.cfg.assignments||[];
  return`<div class="wrap" style="padding-block:28px"><div class="eyebrow">Giao bài</div><h1 style="font-size:clamp(2rem,5vw,2.8rem)">Bài tập &amp; thông báo</h1>
  <div class="grid g2" style="margin-top:20px;align-items:start">
  <div class="card"><h3 style="margin-bottom:14px">Giao bài mới · Lớp ${S.tg}</h3><div class="field"><label for="as-t">Tiêu đề</label><input id="as-t" placeholder="Ôn tập Unit 4"></div>
   <div class="field"><label>Chọn bài học</label><div class="checks">${LG(S.tg).map(L=>`<label><input type="checkbox" name="as-l" value="${L.id}">${uShort(L)}${esc(L.title)}</label>`).join('')}</div></div>
   <div class="grid g2" style="gap:12px"><div class="field"><label for="as-c">Lớp</label><select id="as-c"><option value="">Tất cả lớp</option>${cl.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field"><label for="as-d">Hạn nộp</label><input type="date" id="as-d"></div></div>
   <button class="btn" data-act="addas">Giao bài</button></div>
  <div style="display:grid;gap:16px"><div class="card"><h3 style="margin-bottom:12px">Đã giao · Lớp ${S.tg} (${as.filter(a=>(a.grade||6)===S.tg).length})</h3>${as.filter(a=>(a.grade||6)===S.tg).length?as.map((a,i)=>{if((a.grade||6)!==S.tg)return'';const st=Object.values(S.all).filter(p=>gOf(p)===S.tg&&(!a.cls||p.cls===a.cls));const pr=st.length?st.reduce((x,p)=>x+assignStat(p,a).pct,0)/st.length:0;return`<div style="padding:8px 0;border-top:1px solid var(--line)"><div class="row"><b>${esc(a.title)}</b><span class="sp"></span><button class="btn danger sm" data-delas="${i}">Xóa</button></div><div class="small muted">${a.cls?'Lớp '+esc(a.cls):'Tất cả lớp'}${a.due?' · hạn '+fmtD(a.due):''} · ${(a.lessons||[]).length} bài · ${st.length} học sinh</div><div class="bar" style="margin-top:6px"><i style="width:${pr*100}%"></i></div></div>`}).join(''):'<p class="muted">Chưa giao bài nào.</p>'}</div>
  <div class="card"><h3 style="margin-bottom:12px">Thông báo cho lớp</h3><div class="field"><textarea id="ann" rows="3" placeholder="Ví dụ: Thứ Sáu kiểm tra 15 phút Unit 4." aria-label="Thông báo">${esc(S.cfg.announcement||'')}</textarea></div><button class="btn sm" data-act="saveann">Lưu thông báo</button></div>
  <div class="card"><h3 style="margin-bottom:12px">Danh sách lớp</h3><div class="row" style="margin-bottom:10px">${cl.map(c=>`<span class="chip">${esc(c)} <button data-delcls="${esc(c)}" aria-label="Xóa lớp ${esc(c)}" style="border:0;background:none;cursor:pointer;color:inherit">×</button></span>`).join('')||'<span class="muted small">Chưa có lớp.</span>'}</div><div class="row"><input id="newcls" class="sel-in" placeholder="Tên lớp, ví dụ 6A" style="flex:1"><button class="btn sm" data-act="addcls">Thêm</button></div></div></div></div></div>`}

/* ---------- csv ---------- */
const csv=rows=>'﻿'+rows.map(r=>r.map(c=>{c=String(c==null?'':c);return/[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\n');
async function dl(name,text){try{const d=await window.claude.use('downloads');await d.save({filename:name,data:text});toast('Đã lưu '+name)}catch(e){if(!e||e.code!=='declined')toast('Không tải được tệp')}}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-grade],[data-act],[data-tab],[data-go],[data-sel],[data-mark],[data-say],[data-reset],[data-delas],[data-delcls],[data-tabx]');if(!t)return;
  const D=t.dataset;
  if(D.grade){S.tg=+D.grade;try{localStorage.setItem('ll-tgrade',D.grade)}catch(_){}X=null;S.cls='';render();return}
  if(D.tab){S.tab=D.tab;render();return}
  if(D.tabx){S.tab='ex';return}
  if(D.go){location.hash=D.go;return}
  if(D.sel){S.sel=D.sel;if(location.hash==='#t-student')render();else location.hash='t-student';return}
  if(D.say){try{const u=new SpeechSynthesisUtterance(D.say);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(_){}return}
  if(D.mark){const[uid,k]=D.mark.split('|');const d=S.date;const m=Object.assign({},S.att[d]||{});if(m[uid]===k)delete m[uid];else m[uid]=k;S.att[d]=m;render();try{await S.db.doc('attendance/'+d).set({date:d,marks:m})}catch(_){toast('Không lưu được điểm danh')}return}
  if(D.reset){const p=S.all[S.sel];if(!p)return;delete p.ex[D.reset];render();try{await S.db.doc('progress/'+S.sel).set(JSON.parse(JSON.stringify(p)));toast('Đã đặt lại bài')}catch(_){toast('Chỉ chủ sở hữu mới sửa được dữ liệu học sinh')}return}
  if(D.delas!=null){const a=(S.cfg.assignments||[]).slice();a.splice(+D.delas,1);putCfg({assignments:a});return}
  if(D.delcls){putCfg({classes:(S.cfg.classes||[]).filter(c=>c!==D.delcls)});return}
  const act=D.act;
  if(act==='register'){const n=($('#rg-name').value||'').trim().replace(/\s+/g,' ');const c=($('#rg-cls').value||'').trim();let gr=+($('#rg-grade').value||0);if(!gr){const m=c.match(/^\s*(\d)/);if(m&&(m[1]==='4'||m[1]==='6'))gr=+m[1]}if(n.length<2){toast('Vui lòng nhập họ và tên');return}if(!gr){toast('Vui lòng chọn khối (Lớp 4 hoặc Lớp 6)');return}
    S.prof=Object.assign({ex:{},lv:{},ci:{},days:[],created:Date.now()},S.prof||{},{name:n,cls:c,grade:gr});S.editing=false;saveProf();render();location.hash='home';scrollTo(0,0)}
  else if(act==='editprof'){S.editing=true;render()}
  else if(act==='check')doCheck();
  else if(act==='retry'){X.checked=false;X.show=false;X.ans=X.E.items.map(()=>undefined);X.g=null;render();scrollTo(0,0)}
  else if(act==='reveal'){collect();X.show=!X.show;X.g=null;render()}
  else if(act==='checkin'){const v=($('#ci-code').value||'').trim();if(S.cfg.checkin&&v===String(S.cfg.checkin.code)&&S.cfg.checkin.date===today()){S.prof.ci=S.prof.ci||{};S.prof.ci[today()]=Date.now();saveProf();toast('Điểm danh thành công');render()}else toast('Mã chưa đúng')}
  else if(act==='openci'){putCfg({checkin:{date:S.date,code:String(Math.floor(1000+Math.random()*9000))}})}
  else if(act==='closeci'){putCfg({checkin:null})}
  else if(act==='allP'){const m=Object.assign({},S.att[S.date]||{});visibleStudents().forEach(x=>{if(!m[x.uid])m[x.uid]='P'});S.att[S.date]=m;render();try{await S.db.doc('attendance/'+S.date).set({date:S.date,marks:m})}catch(_){toast('Không lưu được điểm danh')}}
  else if(act==='addas'){const ti=($('#as-t').value||'').trim();const ls=[...document.querySelectorAll('input[name=as-l]:checked')].map(x=>x.value);if(!ti||!ls.length){toast('Nhập tiêu đề và chọn ít nhất một bài');return}
    putCfg({assignments:(S.cfg.assignments||[]).concat([{id:Date.now().toString(36),title:ti,lessons:ls,cls:$('#as-c').value,due:$('#as-d').value||'',grade:S.tg}])});toast('Đã giao bài')}
  else if(act==='saveann'){putCfg({announcement:($('#ann').value||'').trim()});toast('Đã lưu thông báo')}
  else if(act==='addcls'){const v=($('#newcls').value||'').trim();if(v&&!(S.cfg.classes||[]).includes(v))putCfg({classes:(S.cfg.classes||[]).concat([v])})}
  else if(act==='delstu'){if(t.dataset.sure){try{await S.db.doc('progress/'+S.sel).delete();delete S.all[S.sel];location.hash='t-students';toast('Đã xóa học sinh')}catch(_){toast('Chỉ chủ sở hữu mới xóa được')}}else{t.dataset.sure='1';t.textContent='Bấm lần nữa để xóa'}}
  else if(act==='exportp'){const st=visibleStudents();const rows=[['Họ tên','Lớp','Bộ bài đã làm','Tổng số bộ bài','% hoàn thành','Điểm TB (%)','Hoạt động cuối'].concat(LG(S.tg).map(L=>uShort(L)+L.title+' (TB %)'))];
    st.forEach(x=>{const o=overall(x.p);rows.push([x.p.name,x.p.cls,o.done,o.total,Math.round(o.pct*100),o.avg==null?'':Math.round(o.avg*100),x.p.last?new Date(x.p.last).toLocaleString('vi-VN'):''].concat(LG(S.tg).map(L=>{const s=lessonStat(x.p,L);return s.avg==null?'':Math.round(s.avg*100)})))});dl('tien-do-hoc-sinh-lop'+S.tg+'.csv',csv(rows))}
  else if(act==='exporta'){const days=Object.keys(S.att).sort();const st=visibleStudents();const rows=[['Họ tên','Lớp'].concat(days.map(fmtD))];st.forEach(x=>rows.push([x.p.name,x.p.cls].concat(days.map(d=>({P:'Có mặt',L:'Muộn',E:'Có phép',A:'Vắng'}[attOf(x.uid,d)]||'')))));dl('diem-danh.csv',csv(rows))}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='clsf'){S.cls=t.value;render();return}
  if(t.id==='attd'){S.date=t.value||today();render();return}
  if(X&&t.dataset&&t.dataset.i!=null&&!X.checked){collect()}});
document.addEventListener('input',e=>{if(X&&e.target.dataset&&e.target.dataset.i!=null&&!X.checked){collect()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='rg-name'){e.preventDefault();$('[data-act=register]').click()}});
init();
</script>

</body></html>
